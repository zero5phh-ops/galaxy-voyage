<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Galaxy Voyage · 銀河系漫遊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%8C%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:#020208;color:#e8f4ff;font-family:-apple-system,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow-x:hidden}
  #hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8;transition:opacity .45s ease}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  .lbl{position:absolute;transform:translate(-50%,-130%);font-size:12px;font-weight:800;color:#fff;white-space:nowrap;
    text-shadow:0 1px 6px #000,0 0 10px rgba(0,229,255,.7);pointer-events:auto;cursor:pointer;padding:2px 6px;transition:opacity .3s}
  .lbl.big{font-size:13.5px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;backdrop-filter:blur(4px)}
  .lbl.big:hover{background:rgba(0,229,255,.25)}
  #loading{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#020208;transition:opacity .6s}
  #loading .spin{width:54px;height:54px;border-radius:50%;border:4px solid rgba(0,229,255,.2);border-top-color:#00e5ff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadTxt{font-size:14px;color:#8be9fd}
  #title{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;pointer-events:none}
  #title h1{font-size:clamp(24px,5.5vw,40px);font-weight:900;letter-spacing:2px;text-shadow:0 0 24px #00e5ff,0 2px 8px #000}
  #title p{font-size:clamp(12px,3vw,14px);color:#a5f3fc;margin-top:4px;text-shadow:0 1px 6px #000}
  /* ---- 資訊彈窗 ---- */
  #info{position:absolute;z-index:7;left:10px;right:10px;bottom:calc(196px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
    background:rgba(5,10,25,.86);border:1px solid rgba(0,229,255,.4);border-radius:16px;padding:12px 14px;backdrop-filter:blur(10px);
    max-height:26vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(0,229,255,.12);
    animation:pop .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
  #info.hidden{display:none}
  #info h3{font-size:19px;margin-bottom:4px;padding-right:26px}
  #info .blurb{font-size:13.5px;line-height:1.8;color:#cfe8ff;margin-bottom:8px}
  #info table{width:100%;border-collapse:collapse;font-size:13px}
  #info td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:top}
  #info td.k{color:#8be9fd;width:38%}
  #infoClose{position:absolute;top:8px;right:10px;background:none;border:none;color:#8be9fd;font-size:18px;cursor:pointer}
  #infoTag{display:inline-block;font-size:11px;color:#ffd166;border:1px solid rgba(255,209,102,.5);border-radius:999px;padding:1px 8px;margin-bottom:6px}
  #infoTag:empty{display:none}
  #info .hd{cursor:pointer;position:relative;padding-right:26px}
  #info .chev{position:absolute;right:0;top:2px;color:#8be9fd;font-size:16px;opacity:.7;transition:transform .25s;display:none}
  #info.min .bd{display:none}
  #info.min .chev{transform:rotate(180deg)}
  #info .bd{max-height:inherit}
  .facts{margin-top:10px;font-size:13px;line-height:1.75;color:#cfe8ff}
  .facts b{color:#ffd166;display:block;margin-bottom:4px}
  .facts ul{padding-left:18px}
  .facts li{margin-bottom:4px}
  #toast{position:absolute;z-index:9;left:50%;top:calc(110px + env(safe-area-inset-top));transform:translate(-50%,-10px);background:rgba(5,10,25,.9);border:1px solid rgba(255,209,102,.6);color:#ffd166;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #panel{position:relative}
  #panelTog{position:absolute;top:-14px;right:14px;width:34px;height:26px;border-radius:10px;background:rgba(5,10,25,.9);border:1px solid rgba(0,229,255,.45);color:#8be9fd;font-size:16px;line-height:1;cursor:pointer;display:none}
  #panel.min #planetRow,#panel.min label,#panel.min .row:not(#navRow),#panel.min #hint{display:none!important}
  #panel.min{padding-bottom:8px}
  @media (max-width:899px){
    #info{max-height:32vh;padding:10px 12px}
    #info .chev{display:block}
    #info h3{font-size:17px}
    #info .blurb{font-size:13px;line-height:1.7}
    #panelTog{display:block}
    #panel{padding:8px 10px}
    #planetRow{flex-wrap:nowrap!important;overflow-x:auto;justify-content:flex-start!important;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
    #planetRow::-webkit-scrollbar{display:none}
    #planetRow .pbtn{flex:0 0 auto}
    .pbtn{padding:6px 9px;font-size:12px}
    #navRow .pbtn{font-size:12.5px;padding:7px 11px}
    #panel label{margin-top:6px}
    #hint{margin-top:4px;font-size:10.5px}
  }
  /* ---- 知識專區 ---- */
  #know{max-width:900px}
  .kgroup{background:rgba(255,255,255,.035);border:1px solid rgba(0,229,255,.22);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .kgroup summary{cursor:pointer;list-style:none;padding:14px 16px;font-size:18px;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
  .kgroup summary::-webkit-details-marker{display:none}
  .kgroup summary small{font-size:12.5px;color:#8be9fd;font-weight:600}
  .kgroup summary::after{content:'⌄';margin-left:auto;color:#8be9fd;font-size:18px;transition:transform .25s}
  .kgroup[open] summary::after{transform:rotate(180deg)}
  .kgroup .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:0 12px 12px}
  .kcard{background:rgba(5,10,25,.55);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 13px}
  .kcard h4{color:#ffd166;font-size:15px;margin-bottom:6px}
  .kcard p{font-size:13.5px;line-height:1.8;color:#cfe8ff}
  @media (min-width:900px){
    #info{left:auto;right:14px;bottom:auto;top:calc(96px + env(safe-area-inset-top));width:350px;max-width:350px;max-height:calc(100vh - 330px);margin:0}
  }
  #scaleBadge{position:absolute;z-index:6;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid rgba(255,209,102,.6);color:#ffd166;border-radius:12px;padding:6px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  .lbl small{font-size:10px;color:#ffd166;font-weight:800}
  #panel{position:absolute;z-index:6;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;background:rgba(5,10,25,.72);border:1px solid rgba(0,229,255,.35);
    border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px)}
  #panel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
  .pbtn{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.5);color:#dffaff;border-radius:10px;
    padding:7px 10px;font-size:12.5px;font-weight:800;cursor:pointer}
  .pbtn:active{transform:scale(.94);background:rgba(0,229,255,.3)}
  .pbtn.on{background:rgba(0,229,255,.32);border-color:#00e5ff}
  #navRow .pbtn{font-size:13px;padding:8px 14px}
  select.pbtn{appearance:none;-webkit-appearance:none}
  select.pbtn option{color:#000}
  #panel label{font-size:12px;color:#8be9fd;display:flex;align-items:center;gap:6px;margin-top:8px}
  #panel input[type=range]{flex:1;accent-color:#00e5ff}
  #panel .val{font-size:12px;color:#ffd166;min-width:52px;text-align:right}
  #hint{margin-top:6px;font-size:11px;color:#7d93ad;text-align:center}
  #planetRow:empty{display:none}
  section{max-width:720px;margin:0 auto;padding:44px 18px 10px}
  section h2{font-size:24px;margin-bottom:4px;text-shadow:0 0 14px rgba(0,229,255,.6)}
  section .sub{color:#8be9fd;font-size:14px;margin-bottom:14px}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(0,229,255,.22);border-radius:14px;padding:14px 15px;margin-bottom:12px;line-height:1.9;font-size:15px}
  .card b{color:#ffd166}
  table.data{width:100%;border-collapse:collapse;font-size:13px;background:rgba(255,255,255,.03);border-radius:14px;overflow:hidden}
  table.data th,table.data td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
  table.data th{color:#8be9fd;font-size:12px}
  table.data tr:last-child td{border-bottom:none}
  footer{text-align:center;color:#5b6b82;font-size:12px;padding:30px 18px 50px;line-height:2}
</style>
</head>
<body>

<div id="hero">
  <canvas id="gl"></canvas>
  <div id="vig"></div>
  <div id="labels"></div>
  <div id="fade"></div>
  <div id="toast"></div>
  <div id="loading"><div class="spin"></div><div id="loadTxt">Loading textures…</div></div>
  <div id="title">
    <h1 data-i18n="title_h1">🌌 Galaxy Voyage</h1>
    <p data-i18n="title_p">Milky Way → Solar System → Earth &amp; Moon · drag to orbit / scroll to zoom</p>
  </div>
  <div id="scaleBadge" style="display:none"></div>
  <div id="info" class="hidden">
    <button id="infoClose">✕</button>
    <div class="hd" id="infoHd"><h3 id="infoName"></h3><span id="infoTag"></span><span class="chev">⌄</span></div>
    <div class="bd">
      <div class="blurb" id="infoBlurb"></div>
      <table id="infoStats"></table>
      <div class="facts" id="infoFacts"></div>
    </div>
  </div>
  <div id="panel">
    <div class="row" id="navRow">
      <button class="pbtn" data-go="galaxy" data-i18n="gal">🌌</button>
      <button class="pbtn" data-go="sgra" data-i18n="bh">⚫</button>
      <button class="pbtn" data-go="system" data-i18n="sys">☀️</button>
      <button class="pbtn" id="diveBtn" data-i18n="dive" style="display:none">🕳️</button>
      <button class="pbtn" id="knowBtn" data-i18n="more">📖</button>
    </div>
    <button id="panelTog" title="collapse">⌄</button>
    <div class="row" id="planetRow" style="margin-top:6px"></div>
    <label><span data-i18n="zoom_l">Zoom</span><input type="range" id="zoom" min="0" max="1000" value="1000"><span class="val" id="zoomRead"></span></label>
    <label id="timeRow"><span data-i18n="time_l">Time</span><input type="range" id="time" min="0" max="100" value="35"><span class="val" id="timeRead">1.0×</span></label>
    <div class="row" style="margin-top:8px">
      <select id="langSel" class="pbtn">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ms">Melayu</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
      <button class="pbtn on" id="orbitBtn">🛰️</button>
      <button class="pbtn on" id="labelBtn">🏷️</button>
      <button class="pbtn" id="tourBtn" data-i18n="tour">🧭</button>
      <button class="pbtn" id="distBtn" data-i18n="tb_dist">📏</button>
    </div>
    <div id="hint" data-i18n="hint">👆 Drag to orbit · scroll / pinch to zoom · tap a planet for details</div>
  </div>
</div>

<section>
  <h2 data-i18n="s1h">Planets at a glance</h2>
  <div class="sub" data-i18n="s1sub">Sizes and distances in 3D are compressed so everything fits on screen — real numbers below</div>
  <div class="card" style="overflow-x:auto"><table class="data" id="dataTable"></table></div>
  <div class="card" data-i18n="note"></div>
</section>

<section id="know"></section>

<footer data-i18n="foot"></footer>

<script src="three.min.js"></script>

 blurb:{zh:'光環闊28萬km但薄得滯（約10米），主要係冰！卡西尼環縫係俾衛星掃出嚟嘅。密度仲細過水，擺得落水會浮！146粒衛星中最大嗰7粒（泰坦、瑞亞、伊阿珀托斯、狄俄涅、忒堤斯、恩克拉多斯、米瑪斯）全部做咗出嚟，剩低化成光點圍住轉。',en:'Rings 280,000 km wide yet ~10 m thin — nearly pure ice, with the Cassini Division swept by a moon. Less dense than water: it would float! Of its 146 moons, the 7 biggest (Titan, Rhea, Iapetus, Dione, Tethys, Enceladus, Mimas) are all modeled — the rest swirl as motes of light.',ms:'Gelang selebar 280,000 km tetapi setebal ~10 m — hampir ais tulen, dengan Belahan Cassini disapu oleh bulan. Kurang tumpat daripada air: ia akan terapung! Daripada 146 bulannya, 7 yang terbesar (Titan, Rhea, Iapetus, Dione, Tethys, Enceladus, Mimas) semuanya dimodelkan — selebihnya berpusing sebagai titik cahaya.',ko:'고리는 폭 28만km인데 두께는 10m! 거의 순수 얼음이고, 카시니 간극은 위성이 쓸어낸 거예요. 물보다 가벼워서 물에 뜨죠. 146개 위성 중 가장 큰 7개(타이탄, 레아, 이아페투스, 디오네, 테티스, 엔켈라두스, 미마스)는 전부 만들었고, 나머지는 빛의 점으로 돌고 있어요.',ja:'環は幅28万kmなのに厚さ約10m、ほぼ純粋な氷。カッシーニの間隙は衛星が掃いたもの。水より軽く、水に浮きます!146個の衛星のうち最大の7個（タイタン、レア、イアペトゥス、ディオネ、テティス、エンケラドス、ミマス）は全部再現、残りは光の点として周回しています。'}},

 blurb:{zh:'成粒瞓喺度碌（傾98°），可能細個俾嘢撞歪咗。大氣-224°C係咁多行星最凍，甲烷令佢變藍綠色。',en:'Knocked on its side (98° tilt), rolling around the Sun. Its -224°C air is the coldest of all planets; methane paints it teal.',ms:'Terbaring mengiring (condong 98°), berguling mengelilingi Matahari. Udara -224°C paling sejuk; metana mewarnakannya firus.',ko:'98° 기울어져 누워서 굴러요. -224°C로 가장 추운 대기, 메탄 때문에 청록색이죠.',ja:'98°傾いて横倒しで公転。-224°Cで最も寒い大気、メタンで青緑色です。'}},

 stats:{dia:'49,244 km',dis:'30.1 AU',year:'164.8 yrs',day:'16.1 h',moon:'16',temp:'-214°C',extra:{zh:'用數學搵到·2100km/h風',en:'Found by math·2,100 km/h winds',ms:'Ditemui dengan matematik·angin 2,100 km/j',ko:'수학으로 발견·시속 2100km 바람',ja:'数学で発見·時速2100kmの風'}},
 blurb:{zh:'1846年憑數學算出位置再望到嘅行星。超音速風時速2100km係太陽系最快。自轉一圈先164.8年，發現至今只行咗唔夠一圈！',en:'Found by mathematics in 1846 before anyone saw it. Supersonic 2,100 km/h winds — the fastest anywhere. One year is 164.8 Earth years: it hasn\u2019t finished a single lap since discovery!',ms:'Ditemui melalui matematik pada 1846 sebelum sesiapa melihatnya. Angin supersonik 2,100 km/j — terpantas. Setahun 164.8 tahun Bumi: belum lengkap sepusingan sejak ditemui!',ko:'1846년 수학으로 위치를 계산해 찾아냈어요. 시속 2100km 초음속 바람은 최고 기록. 1년이 164.8년이라 발견 이후 한 바퀴도 못 돌았어요!',ja:'1846年に数学で位置を割り出して発見。時速2100kmの超音速の風は最速。1年が164.8年なので発見からまだ1周していません!'}},
{id:'pluto',dist:172,size:0.85,period:90560,tilt:28,spin:-0.06,dwarf:true,name:{zh:'🪐 冥王星',en:'🪐 Pluto',ms:'🪐 Pluto',ko:'🪐 명왕성',ja:'🪐 冥王星'},
 stats:{dia:'2,377 km',dis:'39.5 AU',year:'248 yrs',day:'6.4 days ↺',moon:'5',temp:'-230°C',extra:{zh:'矮行星·心形冰原',en:'Dwarf planet·heart-shaped ice plain',ms:'Planet kerdil·dataran ais bentuk hati',ko:'왜소행성·하트 모양 얼음 평원',ja:'準惑星·ハート形の氷原'}},
 blurb:{zh:'1930年發現、2006年「降級」為矮行星嘅冰凍世界，細過月球。軌道橢圓到有時比海王星更近太陽。2015年新視野號飛過，見到心形嘅「湯博區」氮冰平原、藍色薄霧同冰火山。同衛星卡戎互相潮汐鎖定，永遠面對面。',en:'Found in 1930 and reclassified as a dwarf planet in 2006, this frozen world is smaller than the Moon. Its stretched orbit sometimes brings it closer to the Sun than Neptune. New Horizons flew by in 2015, revealing the heart-shaped nitrogen-ice plain Tombaugh Regio, blue haze and ice volcanoes. Pluto and its moon Charon are locked face to face forever.',ms:'Ditemui 1930 dan diklasifikasi semula sebagai planet kerdil pada 2006, dunia beku ini lebih kecil daripada Bulan. New Horizons melintasinya pada 2015, mendedahkan dataran ais nitrogen berbentuk hati dan jerebu biru. Pluto dan bulannya Charon berkunci berhadapan selamanya.',ko:'1930년 발견, 2006년 왜소행성으로 재분류된 얼어붙은 세계로 달보다 작아요. 2015년 뉴호라이즌스가 하트 모양의 질소 얼음 평원과 푸른 안개를 발견했죠. 위성 카론과 영원히 마주 보며 돌아요.',ja:'1930年発見、2006年に準惑星へ再分類された凍った世界で月より小さい。2015年ニューホライズンズがハート形の窒素氷平原と青い霞を発見。衛星カロンと永遠に向き合って回る。'}},
{id:'charon',parent:'pluto',orbitR:2.2,size:0.42,period:6.39,name:{zh:'🌑 卡戎',en:'🌑 Charon',ms:'🌑 Charon',ko:'🌑 카론',ja:'🌑 カロン'},
 stats:{dia:'1,212 km',dis:'Pluto',year:'6.4 days',day:'locked',moon:'—',temp:'-220°C',extra:{zh:'相對母星最大嘅衛星',en:'Biggest moon relative to its planet',ms:'Bulan terbesar berbanding planetnya',ko:'모행성 대비 가장 큰 위성',ja:'母星比で最大の衛星'}},
 blurb:{zh:'冥王星一半大嘅衛星，兩者其實係圍住中間一點互轉嘅「雙矮行星」。北極有一塊叫「魔多」嘅暗紅色區域，係由冥王星飄過去嘅甲烷凍住變色。',en:'Half the size of Pluto — the pair really orbit a point between them, a double dwarf planet. Its north pole wears a dark red cap called Mordor, methane that drifted over from Pluto and froze.',ms:'Separuh saiz Pluto — pasangan ini mengorbit titik di antara mereka. Kutub utaranya berwarna merah gelap, metana beku dari Pluto.',ko:'명왕성의 절반 크기 — 둘은 사이의 한 점을 도는 이중 왜소행성이에요. 북극엔 명왕성에서 날아와 얼어붙은 메탄의 검붉은 “모르도르”가 있어요.',ja:'冥王星の半分の大きさ —— 2つは間の一点を回る二重準惑星。北極には冥王星から飛来して凍ったメタンの暗赤色「モルドール」がある。'}},

 blurb:{zh:'逆行衛星，可能係捉返嚟嘅古柏帶天體。有氮氣間歇泉噴8km高，表面-235°C。',en:'A backwards-orbiting moon, probably a captured Kuiper object. Nitrogen geysers erupt 8 km high; -235°C surface.',ms:'Bulan berorbit songsang, mungkin objek Kuiper yang ditangkap. Geiser nitrogen memancut 8 km tinggi; permukaan -235°C.',ko:'역행 위성으로 카이퍼벨트 출신일 거예요. 질소 간헐천이 8km 높이로 솟고 표면은 -235°C예요.',ja:'逆行衛星でカイパーベルト出身の可能性。窒素間欠泉が8km噴き上がり、表面-235°Cです。'}}];

 milky:{

  en:['Every star you can see with the naked eye belongs to the Milky Way — no star outside it is visible unaided.','The whole Galaxy is moving at ~600 km/s toward the constellation Hydra, pulled by the Great Attractor.','The disk is warped like a bent frisbee, twisted by passing satellite galaxies.','ESA’s Gaia satellite has measured positions and motions of ~1.8 billion stars — the most detailed galactic map ever.','It is 100,000 ly across but only ~1,000 ly thick — proportionally as thin as a pizza.'],
  ms:['Setiap bintang yang anda lihat dengan mata kasar milik Bima Sakti — tiada bintang luar yang kelihatan.','Seluruh galaksi bergerak ~600 km/s ke arah Hydra, ditarik oleh Penarik Besar.','Cakera galaksi melengkung seperti frisbee bengkok, dipulas oleh galaksi satelit.','Satelit Gaia ESA telah mengukur ~1.8 bilion bintang — peta galaksi paling terperinci.','Lebarnya 100,000 tc tetapi tebal ~1,000 tc — senipis piza.'],
  ko:['맨눈으로 보이는 모든 별은 은하수의 별이에요 — 바깥의 별은 맨눈으로 못 봐요.','은하 전체가 초속 600km로 바다뱀자리 쪽으로 이동 중 — “거대 인력체”가 끌어당겨요.','은하 원반은 휘어진 프리스비처럼 뒤틀려 있어요. 위성은하가 지나가며 비틀었죠.','ESA 가이아 위성이 약 18억 개 별을 측정 — 역사상 가장 정밀한 은하 지도.','지름 10만 광년, 두께 약 1,000광년 — 비율로 보면 피자처럼 얇아요.'],
  ja:['肉眼で見える星はすべて天の川銀河の星 —— 外の星は肉眼では見えません。','銀河全体がうみへび座方向へ秒速600kmで移動中、「グレートアトラクター」に引かれています。','円盤は曲がったフリスビーのように歪み、通過する伴銀河にねじられました。','ESAガイア衛星が約18億個の星を計測 —— 史上最精密な銀河地図。','直径10万光年、厚さ約1,000光年 —— 比率はピザほど薄い。']},
 sgra:{
  zh:['「A*」讀作「A星」，1974年發現時係人馬座最強嘅電波源。','2020年諾貝爾物理獎頒俾Genzel同Ghez，就係憑追蹤附近恆星S2繞黑洞16年一圈嘅軌道證實佢存在。','S2恆星最接近時以每秒7,650km（光速2.5%）飛過，愛因斯坦預言嘅重力紅移都量到。','如果人馬座A*放喺太陽位置，事件視界只到水星軌道嘅一半左右 —— 「大」係質量，唔係體積。','佢好安靜：每日只食掉極少物質，亮度比其他星系中心黑洞暗好多，係「食唔飽」嘅黑洞。'],
  en:['The “A*” is read “A-star”; it was found in 1974 as the strongest radio source in Sagittarius.','The 2020 Nobel Prize in Physics went to Genzel and Ghez for tracking star S2 through a full 16-year orbit around it.','At closest approach S2 races past at 7,650 km/s (2.5% of light speed) — Einstein’s gravitational redshift was measured there.','Placed at the Sun, its event horizon would reach only about half-way to Mercury — “supermassive” is about mass, not size.','It is a quiet eater: it swallows very little each day and is far dimmer than most galactic-centre black holes.'],
  ms:['“A*” dibaca “A-star”; ditemui pada 1974 sebagai sumber radio terkuat di Sagittarius.','Hadiah Nobel Fizik 2020 diberi kepada Genzel dan Ghez kerana menjejak bintang S2 mengorbitnya selama 16 tahun.','Pada titik terdekat S2 melaju 7,650 km/s (2.5% laju cahaya) — anjakan merah graviti Einstein diukur di sini.','Jika diletak di Matahari, ufuknya hanya sampai separuh jalan ke Utarid — “supermasif” tentang jisim, bukan saiz.','Ia pemakan yang senyap: menelan sangat sedikit setiap hari dan jauh lebih malap daripada lubang hitam pusat lain.'],
  ko:['“A*”는 “A-스타”로 읽어요. 1974년 궁수자리 최강 전파원으로 발견됐죠.','2020년 노벨물리학상은 별 S2가 16년에 한 번 도는 궤도를 추적한 겐첼과 게즈에게.','S2는 최근접 때 초속 7,650km(광속의 2.5%)로 지나가요 — 아인슈타인의 중력 적색편이가 측정됐죠.','태양 자리에 놓으면 사건의 지평선은 수성 궤도 절반 정도 — “초대질량”은 질량 얘기, 크기가 아니에요.','조용한 포식자: 하루에 아주 조금만 삼키고, 다른 은하 중심 블랙홀보다 훨씬 어두워요.'],
  ja:['「A*」は「エースター」と読み、1974年にいて座最強の電波源として発見。','2020年ノーベル物理学賞はゲンツェルとゲズへ —— 星S2が16年で1周する軌道を追跡した功績。','S2は最接近時に秒速7,650km（光速の2.5%）で通過、アインシュタインの重力赤方偏移も測定。','太陽の位置に置くと地平面は水星軌道の半分ほど —— 「超大質量」は質量の話でサイズではない。','静かな食べ手：1日にごく少量しか飲み込まず、他の銀河中心ブラックホールよりずっと暗い。']},
 sys:{
  zh:['太陽系99.86%質量喺太陽；剩低嘅入面木星又佔咗七成。','如果太陽係一個籃球，地球係2米外一粒芝麻，海王星喺60米外。','太陽系嘅邊界唔係海王星：柯伊伯帶、奧爾特雲一直伸到約2光年外。','1977年發射嘅航海家1號已飛出日球層，係人類最遠嘅物件，離地球超過240億km。','太陽每11年一個活動週期；50億年後會脹成紅巨星，吞掉水星同金星。'],
  en:['99.86% of the system’s mass is in the Sun; of what is left, Jupiter takes 70%.','If the Sun were a basketball, Earth would be a sesame seed 2 m away and Neptune 60 m away.','The system does not end at Neptune: the Kuiper Belt and Oort Cloud stretch out to ~2 light-years.','Voyager 1, launched in 1977, has left the heliosphere — humanity’s farthest object, over 24 billion km away.','The Sun has an 11-year activity cycle; in ~5 billion years it will swell into a red giant and swallow Mercury and Venus.'],
  ms:['99.86% jisim sistem ada pada Matahari; daripada bakinya Musytari mengambil 70%.','Jika Matahari sebiji bola keranjang, Bumi ialah biji bijan 2 m jauhnya dan Neptun 60 m jauhnya.','Sistem tidak berakhir di Neptun: Jalur Kuiper dan Awan Oort menjangkau ~2 tahun cahaya.','Voyager 1, dilancarkan 1977, telah keluar dari heliosfera — objek terjauh manusia, lebih 24 bilion km.','Matahari ada kitaran 11 tahun; dalam ~5 bilion tahun ia akan menjadi gergasi merah dan menelan Utarid dan Zuhrah.'],
  ko:['태양계 질량의 99.86%는 태양에, 나머지의 70%는 목성에 있어요.','태양이 농구공이면 지구는 2m 밖의 참깨, 해왕성은 60m 밖이에요.','태양계는 해왕성에서 끝나지 않아요: 카이퍼벨트와 오르트 구름이 약 2광년까지 뻗어요.','1977년 발사된 보이저 1호는 태양권을 벗어났어요 — 인류의 가장 먼 물체, 240억 km 이상.','태양은 11년 주기로 활동하고, 약 50억 년 뒤 적색거성이 되어 수성과 금성을 삼켜요.'],
  ja:['太陽系の質量の99.86%は太陽、残りの7割は木星。','太陽がバスケットボールなら地球は2m先のゴマ、海王星は60m先。','太陽系は海王星で終わらない：カイパーベルトとオールトの雲は約2光年先まで。','1977年打ち上げのボイジャー1号は太陽圏を脱出 —— 人類最遠の物体、240億km以上。','太陽は11年周期で活動し、約50億年後に赤色巨星となって水星と金星を飲み込む。']}};

   ja:[['距離','16万光年'],['直径','約14,000光年'],['質量','天の川の約1/100'],['型','不規則棒渦巻矮小銀河'],['見える？','南半球で肉眼で見える']]},
  blurb:{zh:'銀河系最大嘅衛星星系，1519年麥哲倫環球航行時記錄落嚟而得名。入面有蜘蛛星雲（劍魚座30）—— 本星系群最劇烈嘅恆星工廠，如果放喺獵戶座大星雲嘅位置，會大到投影到地面。1987年呢度爆發嘅超新星SN 1987A係400年來最近嘅一粒。',
   en:'The Milky Way’s largest satellite, named after Magellan’s 1519 voyage. It holds the Tarantula Nebula (30 Doradus), the most violent star factory in the Local Group — at the Orion Nebula’s distance it would cast shadows. Supernova SN 1987A exploded here, the closest in 400 years.',
   ms:'Satelit terbesar Bima Sakti, dinamakan sempena pelayaran Magellan 1519. Mengandungi Nebula Tarantula, kilang bintang paling ganas dalam Kumpulan Tempatan. Supernova SN 1987A meletup di sini — yang terdekat dalam 400 tahun.',
   ko:'은하수의 가장 큰 위성은하. 1519년 마젤란 항해에서 기록되어 이름이 붙었어요. 국부은하군에서 가장 격렬한 별 공장인 타란툴라 성운이 있고, 1987년엔 400년 만에 가장 가까운 초신성 SN 1987A가 폭발했어요.',
   ja:'天の川最大の伴銀河。1519年のマゼラン航海の記録から命名。局部銀河群で最も激しい星の工場「タランチュラ星雲」があり、1987年には400年で最も近い超新星SN 1987Aが爆発しました。'},
  facts:{zh:['佈滿宇宙嘅「宇宙距離梯」—— 就係用大麥哲倫雲嘅造父變星校準距離嘅。','大約20億年後會俾銀河系吞併，仲可能將太陽系踢出去更外圍。'],en:['It anchors the cosmic distance ladder — Cepheid stars here calibrate distances across the Universe.','In ~2 billion years it will merge into the Milky Way, possibly nudging the Solar System outward.'],ms:['Ia menjadi asas tangga jarak kosmik melalui bintang Cepheid.','Dalam ~2 bilion tahun ia akan bercantum dengan Bima Sakti.'],ko:['여기의 세페이드 변광성이 우주 거리 사다리의 기준이 돼요.','약 20억 년 뒤 은하수에 합병될 거예요.'],ja:['ここのセファイド変光星が宇宙の距離はしごの基準。','約20億年後に天の川へ合体する。']}},
 smc:{name:{zh:'☁️ 小麥哲倫雲',en:'☁️ Small Magellanic Cloud',ms:'☁️ Awan Magellan Kecil',ko:'☁️ 소마젤란은하',ja:'☁️ 小マゼラン雲'},tag:'tag_sat',
  stats:{zh:[['距離','20萬光年'],['直徑','約7,000光年'],['恆星','幾億粒'],['特別之處','同大麥哲倫雲之間有一條氫氣「麥哲倫橋」'],['麥哲倫流','兩雲身後拖住一條60萬光年長嘅氣體尾巴']],
   en:[['Distance','200,000 ly'],['Diameter','~7,000 ly'],['Stars','a few hundred million'],['Special','Joined to the LMC by a hydrogen “Magellanic Bridge”'],['Magellanic Stream','A 600,000-ly gas tail trails behind both clouds']],
   ms:[['Jarak','200,000 tc'],['Diameter','~7,000 tc'],['Bintang','beberapa ratus juta'],['Istimewa','Dihubungkan ke LMC oleh “Jambatan Magellan” hidrogen'],['Arus Magellan','Ekor gas 600,000 tc']],
   ko:[['거리','20만 광년'],['지름','약 7,000광년'],['항성','수억 개'],['특징','대마젤란과 수소 “마젤란 다리”로 연결'],['마젤란 흐름','60만 광년 길이의 가스 꼬리']],
   ja:[['距離','20万光年'],['直径','約7,000光年'],['恒星','数億個'],['特徴','大マゼラン雲と水素の「マゼラン橋」で接続'],['マゼラン流','60万光年のガスの尾']]},
  blurb:{zh:'大麥哲倫雲嘅細佬，一個被銀河系同大麥哲倫雲潮汐力扯到變形嘅矮星系。佈滿年輕藍星同氫氣雲；哈勃望遠鏡發現佢正俾拉開成兩截。1912年天文學家勒維特就係研究呢度嘅造父變星，發現「週期—光度關係」，令人類第一次量得出宇宙距離。',
   en:'The LMC’s little sibling, a dwarf galaxy warped by tides from both the Milky Way and the LMC. Rich in young blue stars and hydrogen; Hubble shows it being torn in two. In 1912 Henrietta Leavitt studied its Cepheid stars and found the period–luminosity law that first let humans measure cosmic distances.',
   ms:'Adik LMC, galaksi kerdil yang dipulas pasang Bima Sakti dan LMC. Kaya bintang biru muda; Hubble menunjukkan ia terbelah dua. Pada 1912 Henrietta Leavitt mengkaji bintang Cepheid di sini dan menemui hukum tempoh–kecerahan.',
   ko:'대마젤란의 동생. 은하수와 대마젤란의 조석력에 뒤틀린 왜소은하로, 젊은 청색 별과 수소가 풍부해요. 1912년 헨리에타 레빗이 여기의 세페이드 변광성으로 주기-광도 관계를 발견했어요.',
   ja:'大マゼラン雲の弟分。天の川と大マゼラン雲の潮汐で歪んだ矮小銀河で、若い青い星と水素が豊富。1912年ヘンリエッタ・リービットがここのセファイド変光星から周期光度関係を発見しました。'},
  facts:{zh:['南半球嘅水手幾百年來都靠佢同大麥哲倫雲定南方 —— 因為南天冇「北極星」。'],en:['Southern sailors used the two clouds to find south for centuries — the southern sky has no pole star.'],ms:['Pelayar selatan menggunakan kedua awan untuk mencari selatan — langit selatan tiada bintang kutub.'],ko:['남반구 항해사들은 수백 년간 두 은하로 남쪽을 찾았어요 — 남쪽 하늘엔 북극성이 없거든요.'],ja:['南半球の船乗りは何世紀も2つの雲で南を知った —— 南天には北極星がない。']}},
 arm_per:{name:{zh:'🌀 英仙座旋臂',en:'🌀 Perseus Arm',ms:'🌀 Lengan Perseus',ko:'🌀 페르세우스자리 나선팔',ja:'🌀 ペルセウス腕'},tag:'tag_arm',
  stats:{zh:[['類型','兩條主旋臂之一'],['離太陽','約6,400光年（向外）'],['長度','約10萬光年'],['名物','雙星團h+χ、心臟星雲、蟹狀星雲、W51星雲']],en:[['Type','One of two major arms'],['From the Sun','~6,400 ly outward'],['Length','~100,000 ly'],['Landmarks','Double Cluster, Heart Nebula, Crab Nebula, W51']],ms:[['Jenis','Satu daripada dua lengan utama'],['Dari Matahari','~6,400 tc ke luar'],['Panjang','~100,000 tc'],['Mercu','Gugusan Berkembar, Nebula Hati, Nebula Ketam']],ko:[['유형','두 주요 나선팔 중 하나'],['태양에서','바깥쪽 약 6,400광년'],['길이','약 10만 광년'],['명소','이중성단, 하트 성운, 게 성운']],ja:[['型','2本の主腕の1つ'],['太陽から','外側へ約6,400光年'],['長さ','約10万光年'],['名所','二重星団、ハート星雲、かに星雲']]},
  blurb:{zh:'太陽系外側最近嘅主旋臂。冬季夜空好多亮星同星雲都喺呢邊，包括1054年中國史書記載嘅「天關客星」爆炸留低嘅蟹狀星雲。旋臂唔係實物 —— 係恆星「塞車」嘅密度波，星星穿過旋臂時受壓形成，之後又離開。',
   en:'The nearest major arm outward from the Sun. Much of the winter sky lies here, including the Crab Nebula — the remains of a supernova Chinese astronomers recorded in 1054. Arms are not solid: they are density waves, cosmic traffic jams where gas is squeezed into new stars that later drift on.',
   ms:'Lengan utama terdekat di luar Matahari. Banyak langit musim sejuk terletak di sini, termasuk Nebula Ketam — sisa supernova yang dicatat ahli astronomi China pada 1054. Lengan ialah gelombang ketumpatan, bukan objek pepejal.',
   ko:'태양 바깥쪽에서 가장 가까운 주요 나선팔. 겨울 밤하늘의 많은 부분이 여기에 있고, 1054년 중국 천문학자가 기록한 초신성의 잔해 게 성운도 있어요. 나선팔은 실체가 아니라 밀도파, 즉 우주의 교통 체증이에요.',
   ja:'太陽の外側で最も近い主腕。冬の夜空の多くがここにあり、1054年に中国の天文学者が記録した超新星の残骸「かに星雲」もある。腕は実体ではなく密度波、宇宙の交通渋滞です。'},
  facts:{zh:['旋臂會慢慢轉，但轉得比恆星慢 —— 所以太陽每幾千萬年就穿過一次旋臂。'],en:['Arms rotate more slowly than the stars, so the Sun crosses an arm every few tens of millions of years.'],ms:['Lengan berputar lebih perlahan daripada bintang; Matahari melintasi lengan setiap beberapa puluh juta tahun.'],ko:['나선팔은 별보다 느리게 돌아서 태양은 수천만 년마다 팔을 통과해요.'],ja:['腕は星より遅く回るため、太陽は数千万年ごとに腕を横切る。']}},
 arm_sag:{name:{zh:'🌀 人馬座旋臂',en:'🌀 Sagittarius Arm',ms:'🌀 Lengan Sagittarius',ko:'🌀 궁수자리 나선팔',ja:'🌀 いて座腕'},tag:'tag_arm',
  stats:{zh:[['類型','次旋臂（主要係氣體同年輕星）'],['離太陽','約5,000光年（向內）'],['名物','鷹狀星雲「創生之柱」、礁湖星雲、三裂星雲、天鵝星雲'],['夏季','夏夜銀河最光嗰段就係向住佢同銀心']],en:[['Type','Minor arm (mostly gas and young stars)'],['From the Sun','~5,000 ly inward'],['Landmarks','Eagle Nebula “Pillars of Creation”, Lagoon, Trifid, Omega nebulae'],['Summer','The brightest summer Milky Way looks through it toward the centre']],ms:[['Jenis','Lengan kecil (gas dan bintang muda)'],['Dari Matahari','~5,000 tc ke dalam'],['Mercu','Nebula Helang “Tiang Penciptaan”, Lagun, Trifid'],['Musim panas','Bima Sakti paling terang memandang melaluinya']],ko:[['유형','부속 나선팔(주로 가스와 젊은 별)'],['태양에서','안쪽 약 5,000광년'],['명소','독수리 성운 “창조의 기둥”, 라군, 삼렬 성운'],['여름','가장 밝은 여름 은하수가 이쪽을 향해요']],ja:[['型','副腕（主にガスと若い星）'],['太陽から','内側へ約5,000光年'],['名所','わし星雲「創造の柱」、干潟星雲、三裂星雲'],['夏','最も明るい夏の天の川はこの方向']]},
  blurb:{zh:'太陽系內側最近嘅旋臂，望向銀心必經之路。夏天夜晚見到嘅那條最光最濃嘅銀河，就係穿過呢條旋臂望入去。哈勃最出名嘅「創生之柱」照片，就係呢度嘅鷹狀星雲。2021年NASA仲喺呢條旋臂發現一條3,000光年長嘅「斷裂」，好似旋臂上一條刺。',
   en:'The nearest arm inward, on the line of sight to the galactic centre. The dense, bright summer Milky Way is this arm seen edge-on. Hubble’s famous “Pillars of Creation” are in its Eagle Nebula. In 2021 NASA found a 3,000-ly “break” sticking out of it like a splinter.',
   ms:'Lengan terdekat ke dalam, pada garis pandangan ke pusat galaksi. Bima Sakti musim panas yang padat ialah lengan ini. “Tiang Penciptaan” Hubble terletak di Nebula Helangnya.',
   ko:'안쪽으로 가장 가까운 팔이며 은하 중심 방향에 있어요. 짙고 밝은 여름 은하수가 바로 이 팔이죠. 허블의 유명한 “창조의 기둥”이 이곳 독수리 성운에 있어요.',
   ja:'内側で最も近い腕で、銀河中心への視線上にある。濃く明るい夏の天の川はこの腕。ハッブルの有名な「創造の柱」はここのわし星雲にあります。'},
  facts:{zh:['喺呢方向望出去，塵埃太厚，可見光只能穿透約幾千光年 —— 所以我哋一直到20世紀先知道銀心喺邊。'],en:['Dust here is so thick that visible light penetrates only a few thousand light-years — we did not locate the galactic centre until the 20th century.'],ms:['Debu di sini begitu tebal sehingga cahaya nampak hanya menembusi beberapa ribu tahun cahaya.'],ko:['이 방향은 먼지가 너무 짙어 가시광선이 수천 광년밖에 못 가요 — 은하 중심 위치는 20세기에야 알았죠.'],ja:['この方向は塵が厚く可視光は数千光年しか届かない —— 銀河中心の位置は20世紀まで不明だった。']}},
 arm_sct:{name:{zh:'🌀 盾牌-半人馬旋臂',en:'🌀 Scutum–Centaurus Arm',ms:'🌀 Lengan Scutum–Centaurus',ko:'🌀 방패-센타우루스 나선팔',ja:'🌀 たて-ケンタウルス腕'},tag:'tag_arm',
  stats:{zh:[['類型','兩條主旋臂之一'],['起點','中央棒嘅一端'],['名物','手槍星（銀河最光恆星之一）、Westerlund 1超星團'],['對面','同英仙座旋臂差不多對稱']],en:[['Type','One of two major arms'],['Starts at','One end of the central bar'],['Landmarks','Pistol Star, Westerlund 1 super star cluster'],['Mirror','Roughly symmetric with the Perseus Arm']],ms:[['Jenis','Satu daripada dua lengan utama'],['Bermula di','Hujung palang pusat'],['Mercu','Bintang Pistol, gugusan super Westerlund 1'],['Cermin','Hampir simetri dengan Lengan Perseus']],ko:[['유형','두 주요 나선팔 중 하나'],['시작점','중앙 막대의 한쪽 끝'],['명소','피스톨 별, 웨스터룬드 1 초성단'],['대칭','페르세우스팔과 대체로 대칭']],ja:[['型','2本の主腕の1つ'],['起点','中央棒の一端'],['名所','ピストル星、ウェスタールンド1超星団'],['対称','ペルセウス腕とほぼ対称']]},
  blurb:{zh:'由中央棒一端伸出嘅主旋臂，同英仙座旋臂互相對稱，係銀河系嘅「骨架」。呢度恆星密度高，有全銀河最重最光嘅一批恆星。2008年NASA史匹哲望遠鏡用紅外線數星，先確定銀河係「兩條主臂+兩條次臂」，唔係以前以為嘅四條一樣粗。',
   en:'A major arm springing from one end of the central bar, mirroring the Perseus Arm — together they are the Galaxy’s skeleton. It is crowded with some of the heaviest, brightest stars known. In 2008 NASA’s Spitzer telescope counted stars in infrared and showed the Milky Way has two major arms plus two minor ones, not four equal arms.',
   ms:'Lengan utama dari hujung palang pusat, mencerminkan Lengan Perseus — bersama-sama menjadi rangka galaksi. Pada 2008 teleskop Spitzer NASA menunjukkan Bima Sakti mempunyai dua lengan utama dan dua lengan kecil.',
   ko:'중앙 막대 한쪽 끝에서 뻗은 주요 팔로 페르세우스팔과 대칭 — 둘이 은하의 골격이에요. 2008년 NASA 스피처 망원경이 적외선으로 별을 세어 은하수가 주요 팔 2개+부속 팔 2개임을 밝혔죠.',
   ja:'中央棒の一端から伸びる主腕でペルセウス腕と対称 —— 2本で銀河の骨格。2008年NASAスピッツァー望遠鏡が赤外線で星を数え、天の川は主腕2本＋副腕2本と判明。'},
  facts:{zh:['喺呢條旋臂發現嘅Westerlund 1星團入面有幾十粒超巨星，每一粒都大過太陽幾百倍。'],en:['Westerlund 1 in this arm holds dozens of supergiants, each hundreds of times the Sun’s size.'],ms:['Westerlund 1 di lengan ini mempunyai berpuluh bintang super gergasi.'],ko:['이 팔의 웨스터룬드 1 성단에는 태양 수백 배 크기의 초거성이 수십 개 있어요.'],ja:['この腕のウェスタールンド1には太陽の数百倍の超巨星が数十個。']}},
 arm_nor:{name:{zh:'🌀 矩尺座旋臂',en:'🌀 Norma Arm',ms:'🌀 Lengan Norma',ko:'🌀 직각자자리 나선팔',ja:'🌀 じょうぎ座腕'},tag:'tag_arm',
  stats:{zh:[['類型','次旋臂 · 靚近銀心'],['又叫','3千秒差距臂（3-kpc Arm）'],['特別之處','有一部分以每秒50km向外膨脹，可能係中央棒推動'],['觀測','只能用電波同紅外線望到']],en:[['Type','Minor arm, close to the centre'],['Also called','The 3-kpc Arm'],['Special','Part of it expands outward at 50 km/s, likely driven by the central bar'],['Seen with','Radio and infrared only']],ms:[['Jenis','Lengan kecil, dekat pusat'],['Juga dikenali','Lengan 3-kpc'],['Istimewa','Sebahagiannya mengembang keluar 50 km/s'],['Dilihat dengan','Radio dan inframerah sahaja']],ko:[['유형','부속 팔 · 중심 가까이'],['별칭','3-kpc 팔'],['특징','일부가 초속 50km로 바깥으로 팽창'],['관측','전파와 적외선으로만 보임']],ja:[['型','副腕 · 中心近く'],['別名','3kpc腕'],['特徴','一部が秒速50kmで外側へ膨張'],['観測','電波と赤外線のみ']]},
  blurb:{zh:'最靚近銀心嘅內側旋臂，由地球望去完全俾塵埃遮住，只能靚電波望穿。呢度氣體受中央棒嘅引力攪動，好多地方喺高速膨脹或者流入銀心，係銀河系「引擎室」嘅一部分。名字嚟自南天嘅矩尺座 —— 一個代表木匠直角尺嘅細星座。',
   en:'The innermost arm, hidden from optical view by dust and mapped only in radio. Gas here is stirred by the central bar, expanding or streaming into the centre — part of the Galaxy’s engine room. It is named after Norma, a small southern constellation representing a carpenter’s square.',
   ms:'Lengan paling dalam, tersembunyi oleh debu dan dipetakan hanya dengan radio. Gas di sini dikacau oleh palang pusat — sebahagian daripada bilik enjin galaksi. Dinamakan sempena buruj Norma, sesiku tukang kayu.',
   ko:'가장 안쪽 팔로 먼지에 가려 전파로만 지도를 그렸어요. 중앙 막대가 가스를 휘저어 팽창하거나 중심으로 흘러들죠 — 은하의 기관실. 이름은 목수의 직각자를 뜻하는 남쪽 별자리 직각자자리에서 왔어요.',
   ja:'最も内側の腕で、塵に隠れ電波でのみ観測。中央棒がガスをかき混ぜ、膨張したり中心へ流れ込む —— 銀河の機関室。名は大工の直角定規を表す南天の小星座じょうぎ座から。'},
  facts:{zh:['銀河中心方向嘅氣體有一半係咁樣俾棒「掃」入去，最終餵飽咗中心嘅星團同黑洞。'],en:['About half the gas near the centre is swept inward by the bar this way, feeding the central star clusters and the black hole.'],ms:['Kira-kira separuh gas dekat pusat disapu ke dalam oleh palang.'],ko:['중심 근처 가스의 절반가량이 이렇게 막대에 쓸려 들어가 중심 성단과 블랙홀을 먹여요.'],ja:['中心付近のガスの約半分がこうして棒に掃き込まれ、中心の星団とブラックホールを養う。']}}};

const KNOW={
zh:[
{h:'⚫ 黑洞',sub:'宇宙最極端嘅天體',cards:[
 ['黑洞係乜？','一個引力強到連光都逃唔出嘅區域。大質量恆星燒完燃料，核心塌縮到體積近乎零，密度無限大，就形成黑洞。愛因斯坦1915年嘅廣義相對論預言咗佈，但佢本人都唔太相信會真係存在。'],
 ['事件視界','「有去無回」嘅邊界。喺呢條線外面你仲可以逃走；跨過之後，去到中心奇點係唯一嘅未來 —— 就好似時間一樣，冇得倒退。視界半徑（史瓦西半徑）同質量成正比：地球質量嘅黑洞只有9毫米，太陽嘅係3公里。'],
 ['光子球同黑洞陰影','喺視界外1.5倍半徑處，光可以圍住黑洞兜圈。EHT 2019年拍到M87*、2022年拍到人馬座A*嘅「甜甜圈」相，中間黑影其實係光子球投影，比事件視界大2.6倍。'],
 ['吸積盤同噴流','被吸入嘅氣體唔會直接跌落去，而係好似浴缸去水咁旋轉成盤，磨擦到幾百萬度發出X光。部分物質仲會沿磁場向兩極以近光速噴出，長達幾百萬光年 —— 呢啲噴流係宇宙最亮嘅嘢之一（類星體）。'],
 ['意大利麵化','靚近黑洞，你雙腳受嘅引力遠大過頭部，會被拉長壓窄成一條麵。細黑洞越危險：恆星級黑洞喺視界外已經撕碎你；超大質量黑洞（如人馬座A*）反而可以「舒服」跨過視界先死。'],
 ['時間膨脹','越靚近黑洞，時間行得越慢。喺視界附近逗留一小時，出面可能已經過咗幾十年 ——《星際效應》嘅情節係真嘅。GPS衛星都要修正地球引力造成嘅微細時間差。'],
 ['霍金輻射','1974年霍金提出黑洞唔係全黑：量子效應令佈慢慢「蒸發」。但速度極慢 —— 一個太陽質量黑洞要10⁶⁷年先蒸發完，遠長過宇宙年齡。'],
 ['黑洞有幾多種？','恆星級（3–100個太陽質量，由超新星形成）、中等質量（幾百到幾十萬）、超大質量（幾百萬到幾百億，喺星系中心）。2015年LIGO首次探測到兩個黑洞合併嘅重力波，開啟「重力波天文學」。']]},
{h:'🌌 銀河系',sub:'我哋嘅屋企星系',cards:[
 ['結構：棒、盤、暈','中央係一條約27,000光年長嘅恆星棒同核球；外面係薄薄嘅盤（旋臂所在）；再外面係球形嘅恆星暈，有150幾個球狀星團；成個包喺一個巨大嘅暗物質暈裡面，暗物質佔銀河系質量九成。'],
 ['旋臂點解會轉唔散？','如果旋臂係固定嘅一堆星，幾億年就會捲成一團。實際上旋臂係「密度波」—— 好似高速公路塞車：車（恆星）不斷穿過，但塞車帶（旋臂）本身慢慢移動。氣體穿過旋臂時受壓，形成年輕藍星，所以旋臂特別光。'],
 ['銀河年','太陽以每秒230km繞銀心一圈要2.3億年。太陽誕生至今只轉咗約20圈。上一次太陽喺依家嘅位置時，地球仲係三疊紀，恐龍先啱啱出現。'],
 ['幾多粒星？','估計1,000至4,000億粒。大部分係比太陽細嘅紅矮星。銀河每年大約誕生3至7粒新星 —— 已經係「中年」星系，高峰期過咗好多。'],
 ['銀河系嘅童年','約136億年前形成，幾乎同宇宙一樣老。100億年前吞併咗一個叫「蓋亞-恩克拉多斯」嘅星系，形成今日嘅內暈；之後仲食咗好多矮星系，人馬座矮星系正喺被消化中。'],
 ['同仙女座相撞','仙女座星系以每秒110km衝過嚟，約45億年後相撞，融合成一個橢圓星系（外號Milkomeda）。但恆星之間太空曠，幾乎冇兩粒星會真正碰到。'],
 ['銀心：星星最密嘅地方','中心幾光年內有幾百萬粒恆星，密度係太陽附近嘅百萬倍。仲有一對由銀心向上下噴出、各高25,000光年嘅「費米泡」，係幾百萬年前黑洞大爆發嘅痕跡。'],
 ['蓋亞任務','2013年發射，量度18億粒星嘅位置、距離、速度，精度相當於喺地球量月球上一粒硬幣。靚佈我哋第一次可以「倒帶」睇銀河點樣演變。']]},
{h:'☁️ 大小麥哲倫雲',sub:'兩個跟住銀河系走嘅矮星系',cards:[
 ['點解叫麥哲倫？','南半球肉眼可見兩片「斷開嘅雲」，古代南方民族早就認識。1519年麥哲倫環球航行嘅船員記錄落嚟，歐洲先知道，所以用佢個名。'],
 ['大麥哲倫雲','16萬光年遠，直徑14,000光年，質量係銀河1/100，係本星系群第四大星系。入面嘅蜘蛛星雲係本星系群最劇烈嘅恆星工廠，中心星團R136有全宇宙已知最重嘅恆星（超過200個太陽質量）。'],
 ['小麥哲倫雲','20萬光年遠，被銀河系同大雲嘅潮汐力扯到變形，正俾撕開成兩截。兩雲之間有一條氫氣「麥哲倫橋」相連。'],
 ['麥哲倫流','兩雲身後拖住一條長達60萬光年嘅氣體尾巴，橫跨南天半個天空，係佈幾十億年前互相碰撞加上銀河系引力扯出嚟嘅。'],
 ['SN 1987A','1987年2月大麥哲倫雲一粒藍超巨星爆炸，係1604年以來最近嘅超新星，肉眼可見幾個月。人類第一次探測到超新星嘅微中子 —— 比光早3小時到達地球。'],
 ['宇宙距離嘅尺','1912年勒維特研究小麥哲倫雲嘅造父變星，發現越光嘅變星脈動週期越長。有咗呢條規律，哈勃先量到仙女座嘅距離，證實銀河系以外仲有其他星系。'],
 ['未來','兩雲正俾銀河系慢慢扯埋，約20億年後大麥哲倫雲會撞入銀河系，令中心黑洞暴食、質量增8倍，仲可能將太陽系推到更外圍。']]},
{h:'☀️ 太陽系',sub:'由塵埃到八大行星',cards:[
 ['誕生','46億年前，一團氣體塵埃雲（可能俾附近超新星震盪）塌縮旋轉成盤。中心壓縮成太陽，剩低嘅塵埃碰撞黏合成行星。整個過程只用咗幾千萬年。'],
 ['雪線：內外行星嘅分界','太陽附近太熱，冰蒸發，只剩岩石同金屬 → 四粒細細嘅岩石行星。木星軌道以外夠凍，冰可以保存，加上氫氦氣體 → 四粒巨行星。分界線叫「雪線」，大概喺小行星帶附近。'],
 ['小行星帶','火星同木星之間，幾百萬粒岩石，但總質量只有月球4%。最大嘅穀神星（950km）已被歸類為矮行星。唔係「碎咗嘅行星」，而係俾木星引力阻止咗聚合嘅材料。'],
 ['柯伊伯帶同冥王星','海王星以外30–50 AU嘅冰凍天體帶，冥王星、鬩神星、鳥神星都喺呢度。冥王星2006年被重新定義為矮行星 —— 因為佈「清唔到自己嘅軌道」。新視野號2015年飛過，見到心形冰原同藍色大氣。'],
 ['奧爾特雲','包住成個太陽系嘅球形冰塊殼，2,000到100,000 AU（近2光年），係長週期彗星嘅老家。太陽系嘅真正邊界喺呢度 —— 航海家要3萬年先穿得過。'],
 ['太陽風同日球層','太陽不斷噴出帶電粒子（太陽風），吹出一個保護泡「日球層」，擋住大部分銀河宇宙線。地球磁場再擋一次，撞落大氣就變極光。航海家1號2012年穿出日球層，進入星際空間。'],
 ['旅程時間表','光由太陽到地球8分20秒、到木星43分鐘、到海王星4小時、到比鄰星4.2年。最快嘅探測器帕克太陽探測器時速69萬km，去比鄰星都要6,600年。'],
 ['太陽嘅結局','太陽依家46億歲，燃料仲夠燒50億年。之後脹成紅巨星，大到吞掉水星金星、地球被烤焦；最後外層吹走成行星狀星雲，核心變成一粒地球大細嘅白矮星，慢慢冷卻幾萬億年。']]},
{h:'📏 宇宙尺度',sub:'大到冇法想像，用比喻嚟感受',cards:[
 ['光年係幾遠？','光一年行嘅距離：9.46萬億km。同太陽最近嘅恆星比鄰星4.2光年 —— 如果太陽係一粒芝麻，比鄰星喺30公里外。'],
 ['由屋企出發','地球→月球1.3光秒 · →太陽8分 · →海王星4小時 · →奧爾特雲外緣2年 · →比鄰星4.2年 · →銀心26,000年 · →仙女座250萬年 · →可觀測宇宙邊緣465億年（因宇宙膨脹）。'],
 ['我哋嘅地址','地球 → 太陽系 → 獵戶支臂 → 銀河系 → 本星系群（銀河+仙女座+80幾個矮星系）→ 室女座超星系團 → 拉尼亞凱亞超星系團（10萬個星系）→ 可觀測宇宙（約2萬億個星系）。'],
 ['望遠鏡係時光機','你見到嘅太陽係8分鐘前嘅；仙女座係250萬年前嘅光，當時人類先啱啱學會用石器；韋伯望遠鏡見到嘅最遠星系係134億年前，宇宙先3億歲。']]}],
en:[
{h:'⚫ Black holes',sub:'The most extreme objects in the Universe',cards:[
 ['What is a black hole?','A region where gravity is so strong that not even light escapes. When a massive star runs out of fuel its core collapses to almost zero volume and near-infinite density. Einstein’s 1915 general relativity predicted them — though he doubted they could really exist.'],
 ['Event horizon','The point of no return. Outside it you can still escape; inside, the central singularity is your only future, as inevitable as tomorrow. Its radius (the Schwarzschild radius) scales with mass: an Earth-mass black hole is 9 mm across, a Sun-mass one 3 km.'],
 ['Photon sphere & shadow','At 1.5 times the horizon radius light can orbit the hole. The EHT “doughnut” images of M87* (2019) and Sagittarius A* (2022) show a dark shadow that is actually the photon sphere’s silhouette — 2.6 times larger than the horizon itself.'],
 ['Accretion disk & jets','Infalling gas does not drop straight in; it spirals like water down a drain, heating by friction to millions of degrees and blazing in X-rays. Some matter is flung along magnetic fields from the poles at near light speed in jets millions of light-years long — the engines of quasars.'],
 ['Spaghettification','Near a black hole your feet feel far more gravity than your head, stretching you into a noodle. Smaller holes are deadlier: a stellar one shreds you outside the horizon, while a supermassive one like Sgr A* lets you cross the horizon intact — first.'],
 ['Time dilation','Time runs slower the closer you are. An hour near the horizon may be decades outside — the plot of Interstellar is real physics. Even GPS satellites must correct for Earth’s tiny gravitational time shift.'],
 ['Hawking radiation','In 1974 Hawking showed black holes are not quite black: quantum effects make them slowly evaporate. Slowly indeed — a Sun-mass hole needs 10⁶⁷ years, far longer than the age of the Universe.'],
 ['How many kinds?','Stellar-mass (3–100 Suns, born in supernovae), intermediate (hundreds to hundreds of thousands) and supermassive (millions to tens of billions, at galaxy centres). In 2015 LIGO first detected gravitational waves from two merging black holes, opening gravitational-wave astronomy.']]},
{h:'🌌 The Milky Way',sub:'Our home galaxy',cards:[
 ['Structure: bar, disk, halo','A 27,000-ly bar of stars and a bulge at the centre; a thin disk carrying the spiral arms; a spherical stellar halo with 150+ globular clusters; all wrapped in a vast dark-matter halo holding ~90% of the mass.'],
 ['Why don’t the arms wind up?','If arms were fixed groups of stars they would coil into a blur within a few hundred million years. Instead they are density waves — like a motorway traffic jam: cars (stars) pass through while the jam (arm) drifts slowly. Gas squeezed in the arms forms bright young blue stars.'],
 ['The galactic year','The Sun circles the centre at 230 km/s, once every 230 million years, and has made only ~20 laps since birth. Last time it was here, Earth was in the Triassic and dinosaurs had just appeared.'],
 ['How many stars?','100 to 400 billion, most of them red dwarfs smaller than the Sun. The Galaxy now forms only 3–7 new stars a year — a middle-aged galaxy well past its peak.'],
 ['A galactic childhood','It formed ~13.6 billion years ago, nearly as old as the Universe. About 10 billion years ago it swallowed a galaxy called Gaia-Enceladus, building today’s inner halo; it has eaten many dwarfs since and is digesting the Sagittarius dwarf right now.'],
 ['Collision with Andromeda','Andromeda approaches at 110 km/s and will collide in ~4.5 billion years, merging into an elliptical galaxy nicknamed Milkomeda. Stars are so far apart that almost none will actually hit.'],
 ['The centre: the crowded core','Millions of stars crowd the inner few light-years, a million times the density around the Sun. Two “Fermi bubbles” 25,000 ly tall rise above and below the centre — scars of a black-hole outburst millions of years ago.'],
 ['The Gaia mission','Launched in 2013, Gaia measures positions, distances and motions of 1.8 billion stars with a precision equal to spotting a coin on the Moon. For the first time we can “rewind” the Galaxy’s history.']]},
{h:'☁️ The Magellanic Clouds',sub:'Two dwarf galaxies riding along with us',cards:[
 ['Why “Magellanic”?','Two detached “clouds” visible to the naked eye from the southern hemisphere, long known to southern peoples. Magellan’s crew recorded them on the 1519 circumnavigation, bringing them to European attention.'],
 ['Large Magellanic Cloud','160,000 ly away, 14,000 ly across, 1/100 of the Milky Way’s mass — the fourth-largest galaxy in the Local Group. Its Tarantula Nebula is the Group’s fiercest star factory; the cluster R136 at its heart holds the most massive stars known (over 200 Suns).'],
 ['Small Magellanic Cloud','200,000 ly away, warped by tides from both the Milky Way and the LMC and being torn in two. A hydrogen “Magellanic Bridge” links the two clouds.'],
 ['The Magellanic Stream','A 600,000-ly gas tail trailing both clouds across half the southern sky, torn out by their mutual collisions and the Milky Way’s gravity over billions of years.'],
 ['SN 1987A','In February 1987 a blue supergiant in the LMC exploded — the closest supernova since 1604, visible to the naked eye for months. Its neutrinos were detected arriving 3 hours before the light.'],
 ['A ruler for the Universe','In 1912 Henrietta Leavitt studied Cepheid stars in the SMC and found that brighter ones pulse more slowly. That law let Hubble measure Andromeda’s distance and prove other galaxies exist.'],
 ['The future','Both clouds are being reeled in. In ~2 billion years the LMC will crash into the Milky Way, feeding the central black hole until it grows eightfold — and possibly nudging the Solar System outward.']]},
{h:'☀️ The Solar System',sub:'From dust to eight planets',cards:[
 ['Birth','4.6 billion years ago a cloud of gas and dust — perhaps nudged by a nearby supernova — collapsed into a spinning disk. The centre became the Sun; leftover dust clumped into planets, all within a few tens of millions of years.'],
 ['The snow line','Near the Sun ice evaporated, leaving rock and metal — four small rocky planets. Beyond Jupiter it was cold enough for ice to survive and grab hydrogen and helium — four giants. The boundary, the snow line, sits near the asteroid belt.'],
 ['The asteroid belt','Millions of rocks between Mars and Jupiter, yet only 4% of the Moon’s mass in total. Ceres (950 km) is now a dwarf planet. Not a shattered planet, but material Jupiter’s gravity never let assemble.'],
 ['Kuiper Belt & Pluto','An icy belt 30–50 AU out, home to Pluto, Eris and Makemake. Pluto was reclassified as a dwarf planet in 2006 because it has not cleared its orbit. New Horizons flew past in 2015, revealing a heart-shaped ice plain and blue haze.'],
 ['The Oort Cloud','A spherical shell of icy bodies from 2,000 to 100,000 AU (nearly 2 light-years) — the home of long-period comets and the true edge of the Solar System. Voyager needs 30,000 years to cross it.'],
 ['Solar wind & heliosphere','The Sun blows a stream of charged particles that inflates a protective bubble, the heliosphere, blocking most galactic cosmic rays. Earth’s magnetic field adds a second shield; particles that get through paint the aurora. Voyager 1 left the heliosphere in 2012.'],
 ['Travel times','Light takes 8m20s to Earth, 43 min to Jupiter, 4 h to Neptune, 4.2 years to Proxima Centauri. The fastest probe ever, Parker Solar Probe at 690,000 km/h, would still need 6,600 years to reach Proxima.'],
 ['How the Sun ends','The Sun is 4.6 billion years old with fuel for 5 billion more. It will then swell into a red giant, swallowing Mercury and Venus and scorching Earth, before puffing off its outer layers as a planetary nebula and leaving an Earth-sized white dwarf that cools for trillions of years.']]},
{h:'📏 Cosmic scale',sub:'Too big to imagine — so use analogies',cards:[
 ['How far is a light-year?','The distance light travels in a year: 9.46 trillion km. The nearest star, Proxima Centauri, is 4.2 ly away — if the Sun were a sesame seed, Proxima would be 30 km away.'],
 ['Leaving home','Earth→Moon 1.3 light-seconds · →Sun 8 min · →Neptune 4 h · →outer Oort Cloud 2 yr · →Proxima 4.2 yr · →galactic centre 26,000 yr · →Andromeda 2.5 million yr · →edge of the observable Universe 46.5 billion ly (thanks to expansion).'],
 ['Our address','Earth → Solar System → Orion Spur → Milky Way → Local Group (Milky Way + Andromeda + 80-odd dwarfs) → Virgo Supercluster → Laniakea (100,000 galaxies) → observable Universe (~2 trillion galaxies).'],
 ['Telescopes are time machines','You see the Sun as it was 8 minutes ago; Andromeda’s light left 2.5 million years ago when humans first shaped stone tools; the farthest galaxies Webb sees date from 13.4 billion years ago, when the Universe was 300 million years old.']]}],
ms:[
{h:'⚫ Lubang hitam',sub:'Objek paling ekstrem di alam semesta',cards:[
 ['Apa itu lubang hitam?','Kawasan di mana graviti begitu kuat sehingga cahaya pun tak terlepas. Apabila bintang besar kehabisan bahan api, terasnya runtuh ke isipadu hampir sifar. Diramal oleh relativiti am Einstein pada 1915.'],
 ['Ufuk peristiwa','Titik tiada kembali. Jejarinya (jejari Schwarzschild) berkadar dengan jisim: lubang hitam sejisim Bumi hanya 9 mm, sejisim Matahari 3 km.'],
 ['Sfera foton & bayang','Pada 1.5 kali jejari ufuk, cahaya boleh mengorbit. Imej “donat” EHT bagi M87* (2019) dan Sagittarius A* (2022) menunjukkan bayang 2.6 kali lebih besar daripada ufuk.'],
 ['Cakera akresi & jet','Gas berpusar seperti air ke longkang, panas berjuta darjah dan memancarkan sinar-X. Sebahagian dilontar dari kutub pada hampir laju cahaya sebagai jet berjuta tahun cahaya panjang — enjin kuasar.'],
 ['Spaghettifikasi','Kaki anda merasa graviti jauh lebih kuat daripada kepala, meregangkan anda seperti mi. Lubang kecil lebih bahaya; lubang supermasif seperti Sgr A* membiarkan anda melintasi ufuk terlebih dahulu.'],
 ['Pelebaran masa','Masa berjalan lebih perlahan berhampiran lubang hitam. Satu jam dekat ufuk boleh menjadi berdekad di luar — fizik filem Interstellar adalah benar.'],
 ['Sinaran Hawking','Pada 1974 Hawking menunjukkan lubang hitam perlahan-lahan menyejat. Lubang sejisim Matahari perlukan 10⁶⁷ tahun.'],
 ['Berapa jenis?','Jisim bintang (3–100 Matahari), pertengahan, dan supermasif (berjuta hingga berbilion, di pusat galaksi). LIGO mengesan gelombang graviti daripada dua lubang hitam bercantum pada 2015.']]},
{h:'🌌 Bima Sakti',sub:'Galaksi rumah kita',cards:[
 ['Struktur: palang, cakera, halo','Palang bintang 27,000 tc dan bonjol di tengah; cakera nipis dengan lengan pilin; halo bintang dengan 150+ gugusan globul; semuanya dalam halo jirim gelap (~90% jisim).'],
 ['Kenapa lengan tak berbelit?','Lengan ialah gelombang ketumpatan — seperti kesesakan lebuh raya: kereta (bintang) melaluinya sementara kesesakan (lengan) bergerak perlahan. Gas dimampatkan membentuk bintang biru muda yang terang.'],
 ['Tahun galaksi','Matahari mengelilingi pusat pada 230 km/s, sekali setiap 230 juta tahun — hanya ~20 pusingan sejak lahir. Kali terakhir di sini, dinosaur baru muncul.'],
 ['Berapa bintang?','100 hingga 400 bilion, kebanyakannya kerdil merah. Galaksi kini hanya membentuk 3–7 bintang baharu setahun.'],
 ['Zaman kanak-kanak galaksi','Terbentuk ~13.6 bilion tahun lalu. Kira-kira 10 bilion tahun lalu ia menelan galaksi Gaia-Enceladus; kini sedang mencerna kerdil Sagittarius.'],
 ['Perlanggaran dengan Andromeda','Andromeda mendekat pada 110 km/s dan akan berlanggar dalam ~4.5 bilion tahun, membentuk galaksi elips “Milkomeda”. Hampir tiada bintang akan benar-benar bertembung.'],
 ['Pusat yang sesak','Berjuta bintang dalam beberapa tahun cahaya dalaman. Dua “buih Fermi” setinggi 25,000 tc — parut letusan lubang hitam berjuta tahun lalu.'],
 ['Misi Gaia','Dilancarkan 2013, mengukur 1.8 bilion bintang dengan ketepatan melihat syiling di Bulan.']]},
{h:'☁️ Awan Magellan',sub:'Dua galaksi kerdil yang mengikut kita',cards:[
 ['Kenapa “Magellan”?','Dua “awan” terpisah kelihatan dengan mata kasar dari hemisfera selatan, dicatat oleh kru Magellan pada 1519.'],
 ['Awan Magellan Besar','160,000 tc jauh, 14,000 tc lebar, 1/100 jisim Bima Sakti. Nebula Tarantula ialah kilang bintang paling ganas dalam Kumpulan Tempatan; gugusan R136 mempunyai bintang paling berjisim diketahui.'],
 ['Awan Magellan Kecil','200,000 tc jauh, dipulas oleh pasang dan sedang terbelah dua. “Jambatan Magellan” hidrogen menghubungkan kedua awan.'],
 ['Arus Magellan','Ekor gas 600,000 tc di belakang kedua awan, merentasi separuh langit selatan.'],
 ['SN 1987A','Februari 1987, bintang super gergasi biru di LMC meletup — supernova terdekat sejak 1604. Neutrinonya tiba 3 jam sebelum cahaya.'],
 ['Pembaris alam semesta','Pada 1912 Henrietta Leavitt mengkaji bintang Cepheid di SMC dan menemui hukum tempoh–kecerahan yang membolehkan Hubble mengukur jarak Andromeda.'],
 ['Masa depan','Dalam ~2 bilion tahun LMC akan berlanggar dengan Bima Sakti, membesarkan lubang hitam pusat lapan kali ganda.']]},
{h:'☀️ Sistem Suria',sub:'Daripada debu kepada lapan planet',cards:[
 ['Kelahiran','4.6 bilion tahun lalu awan gas dan debu runtuh menjadi cakera berputar. Pusatnya menjadi Matahari; debu selebihnya berkumpul menjadi planet dalam beberapa puluh juta tahun.'],
 ['Garis salji','Dekat Matahari ais tersejat — empat planet berbatu kecil. Di luar Musytari ais kekal dan menangkap hidrogen serta helium — empat gergasi.'],
 ['Jalur asteroid','Berjuta batu antara Marikh dan Musytari, tetapi hanya 4% jisim Bulan. Ceres (950 km) kini planet kerdil.'],
 ['Jalur Kuiper & Pluto','Jalur berais 30–50 AU, rumah Pluto, Eris dan Makemake. Pluto diklasifikasi semula sebagai planet kerdil pada 2006. New Horizons melintasinya pada 2015.'],
 ['Awan Oort','Cengkerang sfera jasad berais dari 2,000 hingga 100,000 AU (hampir 2 tahun cahaya) — rumah komet tempoh panjang dan sempadan sebenar Sistem Suria.'],
 ['Angin suria & heliosfera','Matahari meniup zarah bercas yang membentuk buih pelindung. Zarah yang menembusi medan magnet Bumi mencipta aurora. Voyager 1 keluar dari heliosfera pada 2012.'],
 ['Masa perjalanan','Cahaya: 8m20s ke Bumi, 43 min ke Musytari, 4 j ke Neptun, 4.2 tahun ke Proxima Centauri. Prob terpantas masih perlukan 6,600 tahun ke Proxima.'],
 ['Pengakhiran Matahari','Dalam ~5 bilion tahun Matahari menjadi gergasi merah, menelan Utarid dan Zuhrah, kemudian meninggalkan kerdil putih sebesar Bumi.']]},
{h:'📏 Skala kosmos',sub:'Terlalu besar untuk dibayangkan',cards:[
 ['Sejauh mana tahun cahaya?','Jarak cahaya dalam setahun: 9.46 trilion km. Proxima Centauri 4.2 tc — jika Matahari sebiji bijan, Proxima 30 km jauhnya.'],
 ['Meninggalkan rumah','Bumi→Bulan 1.3 saat cahaya · →Matahari 8 min · →Neptun 4 j · →Proxima 4.2 tahun · →pusat galaksi 26,000 tahun · →Andromeda 2.5 juta tahun · →pinggir alam semesta 46.5 bilion tc.'],
 ['Alamat kita','Bumi → Sistem Suria → Taji Orion → Bima Sakti → Kumpulan Tempatan → Superkelompok Virgo → Laniakea → alam semesta boleh cerap (~2 trilion galaksi).'],
 ['Teleskop ialah mesin masa','Matahari yang anda lihat ialah 8 minit lalu; cahaya Andromeda bertolak 2.5 juta tahun lalu; galaksi terjauh Webb berusia 13.4 bilion tahun.']]}],
ko:[
{h:'⚫ 블랙홀',sub:'우주에서 가장 극단적인 천체',cards:[
 ['블랙홀이란?','빛조차 빠져나올 수 없을 만큼 중력이 강한 영역. 무거운 별이 연료를 다 쓰면 핵이 거의 0의 부피로 붕괴해요. 1915년 아인슈타인의 일반상대성이론이 예측했죠.'],
 ['사건의 지평선','돌아올 수 없는 경계. 반지름(슈바르츠실트 반지름)은 질량에 비례해요: 지구 질량 블랙홀은 9mm, 태양 질량은 3km.'],
 ['광자구와 그림자','지평선 반지름 1.5배에서 빛이 공전해요. EHT의 M87*(2019)와 궁수자리 A*(2022) “도넛” 사진의 그림자는 지평선보다 2.6배 커요.'],
 ['강착원반과 제트','가스는 배수구 물처럼 소용돌이치며 수백만 도로 가열되어 X선을 내요. 일부는 극에서 광속에 가까운 제트로 수백만 광년 뻗어요 — 퀘이사의 엔진.'],
 ['스파게티화','발이 머리보다 훨씬 강한 중력을 받아 국수처럼 늘어나요. 작은 블랙홀이 더 위험하고, 초대질량 블랙홀은 지평선을 먼저 무사히 넘게 해줘요.'],
 ['시간 지연','가까울수록 시간이 느려져요. 지평선 근처의 한 시간이 바깥의 수십 년 — 영화 인터스텔라의 물리는 진짜예요.'],
 ['호킹 복사','1974년 호킹은 블랙홀이 천천히 증발한다고 밝혔어요. 태양 질량 블랙홀은 10⁶⁷년이 걸려요.'],
 ['종류는?','항성 질량(태양 3–100배), 중간 질량, 초대질량(수백만~수백억 배, 은하 중심). 2015년 LIGO가 두 블랙홀 합병의 중력파를 처음 검출했어요.']]},
{h:'🌌 은하수',sub:'우리의 고향 은하',cards:[
 ['구조: 막대, 원반, 헤일로','중심에 27,000광년 길이의 막대와 팽대부, 나선팔을 품은 얇은 원반, 구상성단 150여 개의 헤일로, 전체를 감싼 암흑물질 헤일로(질량의 약 90%).'],
 ['나선팔이 감기지 않는 이유','나선팔은 밀도파 — 고속도로 정체처럼 차(별)는 지나가고 정체(팔)는 천천히 움직여요. 압축된 가스가 밝은 청색 별을 만들죠.'],
 ['은하년','태양은 초속 230km로 2.3억 년에 한 바퀴, 탄생 후 약 20바퀴만 돌았어요. 지난번 이 자리에 있을 때 공룡이 막 등장했죠.'],
 ['별은 몇 개?','1,000억~4,000억 개, 대부분 적색왜성. 지금은 1년에 별 3~7개만 만드는 중년 은하예요.'],
 ['은하의 어린 시절','약 136억 년 전 형성. 약 100억 년 전 가이아-엔켈라두스 은하를 삼켰고, 지금은 궁수자리 왜소은하를 소화 중이에요.'],
 ['안드로메다와 충돌','안드로메다가 초속 110km로 접근, 약 45억 년 뒤 충돌해 타원은하 “밀코메다”가 돼요. 별끼리 실제로 부딪히는 일은 거의 없어요.'],
 ['붐비는 중심','안쪽 몇 광년에 수백만 개 별. 위아래로 25,000광년 높이의 “페르미 거품” — 수백만 년 전 블랙홀 폭발의 흔적.'],
 ['가이아 임무','2013년 발사, 18억 개 별을 달 위의 동전을 보는 정밀도로 측정.']]},
{h:'☁️ 마젤란은하',sub:'우리를 따라오는 두 왜소은하',cards:[
 ['왜 “마젤란”?','남반구에서 맨눈으로 보이는 두 “구름”. 1519년 마젤란 항해 선원들이 기록했어요.'],
 ['대마젤란은하','16만 광년 거리, 지름 14,000광년, 은하수 질량의 1/100. 타란툴라 성운은 국부은하군 최대의 별 공장이고, R136 성단엔 태양 200배 넘는 가장 무거운 별들이 있어요.'],
 ['소마젤란은하','20만 광년 거리, 조석력에 뒤틀려 둘로 찢어지는 중. 수소 “마젤란 다리”가 두 은하를 이어요.'],
 ['마젤란 흐름','두 은하 뒤로 60만 광년 뻗은 가스 꼬리, 남쪽 하늘의 절반을 가로질러요.'],
 ['SN 1987A','1987년 2월 대마젤란의 청색초거성 폭발 — 1604년 이후 가장 가까운 초신성. 중성미자가 빛보다 3시간 먼저 도착했어요.'],
 ['우주의 잣대','1912년 헨리에타 레빗이 소마젤란의 세페이드 변광성에서 주기-광도 관계를 발견, 허블이 안드로메다 거리를 측정할 수 있게 됐어요.'],
 ['미래','약 20억 년 뒤 대마젤란이 은하수에 충돌해 중심 블랙홀을 8배로 키울 거예요.']]},
{h:'☀️ 태양계',sub:'먼지에서 여덟 행성까지',cards:[
 ['탄생','46억 년 전 가스와 먼지 구름이 회전 원반으로 붕괴. 중심은 태양이 되고 남은 먼지가 수천만 년 안에 행성으로 뭉쳤어요.'],
 ['눈 경계선','태양 근처는 얼음이 증발해 작은 암석 행성 4개, 목성 밖은 얼음이 남아 수소·헬륨을 붙잡은 거대행성 4개.'],
 ['소행성대','화성과 목성 사이 수백만 개의 암석, 하지만 총질량은 달의 4%. 세레스(950km)는 왜소행성.'],
 ['카이퍼벨트와 명왕성','30–50 AU의 얼음 천체 띠. 명왕성은 2006년 궤도를 정리하지 못해 왜소행성으로 재분류. 뉴호라이즌스가 2015년 통과.'],
 ['오르트 구름','2,000~100,000 AU(거의 2광년)의 얼음 껍질 — 장주기 혜성의 고향, 태양계의 진짜 경계.'],
 ['태양풍과 태양권','태양이 뿜는 대전 입자가 보호 거품을 만들어요. 지구 자기장을 뚫은 입자는 오로라가 되죠. 보이저 1호는 2012년 태양권을 벗어났어요.'],
 ['이동 시간','빛: 지구까지 8분 20초, 목성 43분, 해왕성 4시간, 프록시마 센타우리 4.2년. 가장 빠른 탐사선도 프록시마까지 6,600년.'],
 ['태양의 끝','약 50억 년 뒤 적색거성이 되어 수성과 금성을 삼키고, 지구 크기의 백색왜성만 남아요.']]},
{h:'📏 우주의 크기',sub:'상상하기엔 너무 커서 비유로',cards:[
 ['1광년은 얼마나?','빛이 1년에 가는 거리 9.46조 km. 프록시마 센타우리는 4.2광년 — 태양이 참깨라면 프록시마는 30km 밖.'],
 ['집을 떠나','지구→달 1.3광초 · →태양 8분 · →해왕성 4시간 · →프록시마 4.2년 · →은하 중심 26,000년 · →안드로메다 250만 년 · →관측 가능 우주 끝 465억 광년.'],
 ['우리의 주소','지구 → 태양계 → 오리온 지류 → 은하수 → 국부은하군 → 처녀자리 초은하단 → 라니아케아 → 관측 가능 우주(약 2조 개 은하).'],
 ['망원경은 타임머신','보이는 태양은 8분 전, 안드로메다는 250만 년 전의 빛, 웹 망원경의 가장 먼 은하는 134억 년 전.']]}],
ja:[
{h:'⚫ ブラックホール',sub:'宇宙で最も極端な天体',cards:[
 ['ブラックホールとは？','光さえ逃げられないほど重力が強い領域。大質量星が燃料を使い切ると核がほぼ体積ゼロに崩壊する。1915年アインシュタインの一般相対性理論が予言。'],
 ['事象の地平面','帰還不能の境界。半径（シュワルツシルト半径）は質量に比例：地球質量なら9mm、太陽質量なら3km。'],
 ['光子球と影','地平面半径の1.5倍で光が周回。EHTのM87*（2019）といて座A*（2022）の「ドーナツ」画像の影は地平面の2.6倍。'],
 ['降着円盤とジェット','ガスは排水口の水のように渦を巻き、数百万度に熱せられX線を放つ。一部は極から光速近くのジェットとして数百万光年 —— クエーサーのエンジン。'],
 ['スパゲッティ化','足が頭よりずっと強い重力を受け麺のように伸びる。小さい穴ほど危険で、超大質量なら地平面を無事に越えられる —— まずは。'],
 ['時間の遅れ','近いほど時間が遅く進む。地平面近くの1時間が外の数十年 —— 映画インターステラーの物理は本物。'],
 ['ホーキング放射','1974年ホーキングはブラックホールがゆっくり蒸発すると示した。太陽質量なら10⁶⁷年。'],
 ['種類は？','恒星質量（太陽3–100倍）、中間質量、超大質量（数百万〜数百億倍、銀河中心）。2015年LIGOが2つの合体の重力波を初検出。']]},
{h:'🌌 天の川銀河',sub:'私たちの故郷',cards:[
 ['構造：棒・円盤・ハロー','中心に27,000光年の棒とバルジ、渦状腕を持つ薄い円盤、球状星団150以上のハロー、全体を包む暗黒物質ハロー（質量の約90%）。'],
 ['腕が巻き込まれない理由','腕は密度波 —— 高速道路の渋滞のように車（星）は通り抜け、渋滞（腕）はゆっくり動く。圧縮されたガスが明るい青い星を作る。'],
 ['銀河年','太陽は秒速230kmで2.3億年に1周、誕生以来約20周のみ。前回ここにいた時、恐竜が現れたばかりだった。'],
 ['星の数は？','1,000億〜4,000億個、大半は赤色矮星。今は年に3〜7個しか星を作らない中年銀河。'],
 ['銀河の幼少期','約136億年前に形成。約100億年前にガイア・エンケラドゥス銀河を飲み込み、今はいて座矮小銀河を消化中。'],
 ['アンドロメダとの衝突','アンドロメダが秒速110kmで接近、約45億年後に衝突し楕円銀河「ミルコメダ」に。星同士が実際にぶつかることはほぼない。'],
 ['混み合う中心','内側数光年に数百万の星。上下に高さ25,000光年の「フェルミバブル」—— 数百万年前のブラックホール噴出の傷跡。'],
 ['ガイアミッション','2013年打ち上げ、18億個の星を月面のコインを見分ける精度で計測。']]},
{h:'☁️ マゼラン雲',sub:'私たちに付き従う2つの矮小銀河',cards:[
 ['なぜ「マゼラン」？','南半球で肉眼で見える2つの「雲」。1519年マゼラン航海の乗組員が記録。'],
 ['大マゼラン雲','16万光年、直径14,000光年、天の川の1/100の質量。タランチュラ星雲は局部銀河群最大の星の工場、R136星団には太陽200倍超の最重量星。'],
 ['小マゼラン雲','20万光年、潮汐で歪み2つに裂けつつある。水素の「マゼラン橋」が両雲をつなぐ。'],

function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function R(a){let s=a;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
function bandTex(base,bands,seed,wobble){
 const w=512,h=256,c=cnv(w,h),g=c.getContext('2d'),rnd=R(seed);
 g.fillStyle=base;g.fillRect(0,0,w,h);
 for(const [y0,y1,col] of bands){
  g.fillStyle=col;
  g.beginPath();g.moveTo(0,y0);
  for(let x=0;x<=w;x+=8)g.lineTo(x,y0+Math.sin(x*0.02+y0)*wobble+(rnd()-0.5)*4);
  for(let x=w;x>=0;x-=8)g.lineTo(x,y1+Math.sin(x*0.025+y1)*wobble+(rnd()-0.5)*4);
  g.fill();}
 for(let i=0;i<900;i++){g.fillStyle=`rgba(255,255,255,${rnd()*0.05})`;g.fillRect(rnd()*w,rnd()*h,2,1);}
 return tex(c);}
function rockTex(base,dark,nC,seed){

 for(let i=0;i<nC;i++){const x=rnd()*w,y=rnd()*h,r=2+rnd()*14;
  g.fillStyle=dark;g.globalAlpha=0.5;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.globalAlpha=0.35;g.fillStyle='#fff';g.beginPath();g.arc(x-r*0.25,y-r*0.25,r*0.55,0,7);g.fill();g.globalAlpha=1;}
 for(let i=0;i<1500;i++){g.fillStyle=`rgba(0,0,0,${rnd()*0.08})`;g.fillRect(rnd()*w,rnd()*h,2,2);}
 return tex(c);}

function ringTex(){
 const c=cnv(256,8),g=c.getContext('2d'),rnd=R(5);
 for(let x=0;x<256;x++){
  const u=x/256;
  let a=0.25+0.6*Math.abs(Math.sin(u*40+rnd()*0))*(0.5+0.5*Math.sin(u*13));
  if(u>0.62&&u<0.70)a=0.03;
  if(u<0.06)a*=u/0.06;
  const shade=180+Math.floor(60*Math.sin(u*90));
  g.fillStyle=`rgba(${shade},${shade-20},${shade-60},${Math.max(0,Math.min(1,a))})`;
  g.fillRect(x,0,1,8);}
 return tex(c);}

function craters(g,w,h,n,rnd,rmin,rmax,floor,rim,ray){
 for(let i=0;i<n;i++){const x=rnd()*w,y=rnd()*h,r=rmin+Math.pow(rnd(),2)*(rmax-rmin);
  const fl=g.createRadialGradient(x,y,r*0.1,x,y,r);fl.addColorStop(0,floor);fl.addColorStop(0.75,floor.replace(/[\d.]+\)$/,'0.35)'));fl.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=fl;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.strokeStyle=rim;g.lineWidth=Math.max(1,r*0.16);g.beginPath();g.arc(x,y,r*0.92,Math.PI*0.9,Math.PI*2.1);g.stroke();
  g.strokeStyle='rgba(0,0,0,.35)';g.beginPath();g.arc(x,y,r*0.92,Math.PI*-0.1,Math.PI*0.9);g.stroke();
  if(ray&&rnd()<ray){g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1;for(let k=0;k<14;k++){const a=rnd()*7,L=r*(2+rnd()*4);g.beginPath();g.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r);g.lineTo(x+Math.cos(a)*L,y+Math.sin(a)*L);g.stroke();}}}}

/* ================= 人馬座A* 黑洞：光線追蹤 shader（重力透鏡 + 吸積盤 + 多普勒增亮） ================= */
const BH_FRAG=`
varying vec2 v_uv;
uniform vec2 u_res;uniform float u_time;uniform float u_dist;
uniform vec2 u_ang;uniform float u_bend;uniform float u_steps;uniform float u_alpha;uniform vec2 u_off;
uniform sampler2D u_sky;uniform float u_hasSky;
float hash(vec3 p){p=fract(p*0.3183099+.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.-2.*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1.,0.,0.)),f.x),mix(hash(i+vec3(0.,1.,0.)),hash(i+vec3(1.,1.,0.)),f.x),f.y),
 mix(mix(hash(i+vec3(0.,0.,1.)),hash(i+vec3(1.,0.,1.)),f.x),mix(hash(i+vec3(0.,1.,1.)),hash(i+vec3(1.,1.,1.)),f.x),f.y),f.z);}
vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}
/* 背景：真實銀河全景（等距柱狀投影）+ 程序星點 */
vec3 sky(vec3 d){
 vec3 col=vec3(0.);
 if(u_hasSky>0.5){
  vec2 uv=vec2(atan(d.z,d.x)/6.2831853+0.5,asin(clamp(d.y,-1.,1.))/3.1415927+0.5);
  vec3 s=texture2D(u_sky,uv).rgb;
  col+=s*1.1+s*s*0.4;
 }else{
  float band=exp(-pow(dot(d,normalize(vec3(0.3,1.,0.2)))*3.,2.));
  col+=vec3(.11,.13,.20)*band*(0.55+0.45*noise(d*7.));
 }
 vec3 g=d*140.;vec3 id=floor(g);
 float h=hash(id);
 if(h>0.93){
  vec3 c=fract(g)-0.5;
  float s=smoothstep(0.08,0.,length(c))*smoothstep(0.93,1.,h);
  float tw=0.8+0.2*sin(u_time*3.+h*40.);
  vec3 tint=mix(vec3(.75,.85,1.),vec3(1.,.88,.72),fract(h*7.));
  col+=tint*s*tw*(0.6+fract(h*13.))*1.6;
 }
 return col;}
/* 吸積盤：溫度隨半徑下降（內白熾→橙→暗紅）、細條紋、開普勒差速旋轉 */
const float DIN=1.9;const float DOUT=7.5;
vec3 disk(float r,float a,out float bright){
 float x=clamp((r-DIN)/(DOUT-DIN),0.,1.);
 float w=1.6/pow(r,1.5);                 // 開普勒角速度
 float ang=a+u_time*w;
 float s1=noise(vec3(r*2.2,ang*1.5,u_time*0.15));
 float s2=noise(vec3(r*11.,ang*4.,1.7+u_time*0.05));
 float s3=noise(vec3(r*38.,ang*1.2,3.1));           // 細環紋
 float s4=noise(vec3(r*6.,ang*24.,5.));             // 方位條紋
 float rad=pow(DIN/r,1.9);                           // 亮度向內急升
 float edge=smoothstep(0.,0.05,x)*smoothstep(1.,0.55,x);
 bright=edge*rad*(0.45+0.9*s1)*(0.55+0.7*s2)*(0.7+0.6*s3)*(0.8+0.4*s4);
 vec3 c=mix(vec3(1.,.96,.9),vec3(1.,.72,.36),smoothstep(0.,0.12,x));
 c=mix(c,vec3(1.,.45,.14),smoothstep(0.12,0.4,x));
 c=mix(c,vec3(.6,.16,.05),smoothstep(0.4,1.,x));
 return c;}
void main(){
 vec2 uv=v_uv*2.-1.+u_off;uv.x*=u_res.x/u_res.y;
 float th=u_ang.x,ph=u_ang.y;
 vec3 ro=vec3(sin(ph)*cos(th),cos(ph),sin(ph)*sin(th))*u_dist;
 vec3 fw=normalize(-ro);
 vec3 rt=normalize(cross(fw,vec3(0.,1.,0.)));
 vec3 up=cross(rt,fw);
 vec3 rd=normalize(uv.x*rt+uv.y*up+1.3*fw);
 vec3 p=ro,v=rd;
 vec3 h=cross(p,v);
 float h2=dot(h,h);
 vec3 col=vec3(0.);
 float alpha=0.;
 float minR=1e9;
 float prevY=p.y+0.0001;
 int STEPS=int(u_steps+0.5);
 for(int i=0;i<220;i++){
  if(i>=STEPS)break;
  float r2=dot(p,p);
  float r=sqrt(r2);
  if(r<minR)minR=r;
  if(r<1.){alpha=1.;break;}
  float step=0.085*(0.35+0.22*r);
  v=normalize(v-p*(u_bend*h2/(r2*r2*r))*step);   // 史瓦西測地線
  vec3 np=p+v*step;
  if((prevY>0.)!=(np.y>0.)){
   float t=prevY/(prevY-np.y);
   vec3 hit=mix(p,np,t);
   float hr=length(hit.xz);
   if(hr>DIN&&hr<DOUT){
    float ang=atan(hit.z,hit.x);
    float br;vec3 dc=disk(hr,ang,br);
    vec3 tang=normalize(vec3(-hit.z,0.,hit.x));
    float vorb=sqrt(0.5/hr);                       // 圓軌道速度 (c=1, rs=1)
    float gam=1./sqrt(max(0.05,1.-vorb*vorb));
    vec3 toCam=normalize(ro-hit);
    float D=1./(gam*(1.-vorb*dot(tang,toCam)));   // 多普勒因子
    float gred=sqrt(max(0.,1.-1./hr));             // 重力紅移
    float I=pow(clamp(D,0.,2.4),3.0)*gred;          // 相對論性增亮
    dc=mix(dc,vec3(.85,.9,1.),clamp((D-1.)*0.9,0.,0.45));   // 迎面：偏藍白
    dc=mix(dc,vec3(1.,.3,.08),clamp((1.-D)*1.2,0.,0.6));    // 背面：偏紅暗
    float trans=clamp(br*1.8,0.,1.)*0.92;
    col+=dc*I*br*1.15*(1.-alpha)*trans;
    alpha+=(1.-alpha)*trans;
    if(alpha>0.99)break;
   }
  }
  p=np;prevY=np.y;
  if(dot(p,p)>4900.)break;
 }
 // 參考系拖拽：越貼近黑洞，背景星空被扭成旋渦
 float sw=1.1/(minR*minR+0.15);
 vec3 vv=normalize(v);vv=vec3(vv.x*cos(sw)-vv.z*sin(sw),vv.y,vv.x*sin(sw)+vv.z*cos(sw));
 vec3 bg=sky(vv);
 col+=bg*(1.-alpha);
 // 光子環：光繞黑洞兜圈嘅極薄亮環
 float ring=smoothstep(0.16,0.,abs(minR-1.5))*1.6+smoothstep(0.6,0.,abs(minR-1.5))*0.25;
 col+=vec3(1.,.88,.7)*ring*(1.-alpha);
 // 近視界暗角（重力拖曳感）
 vec2 q=v_uv-0.5;
 col*=1.-dot(q,q)*0.45;
 // 靚近視界：畫面偏紅（重力紅移）、邊緣收窄（潮汐拉扯感）
 float near=smoothstep(5.,2.05,u_dist);
 col=mix(col,col*vec3(1.05,.62,.42),near*0.65);
 col*=1.-near*dot(q,q)*2.2;
 col=aces(col*0.95);
 col=pow(col,vec3(0.92));
 gl_FragColor=vec4(col,u_alpha);
}`;
const BH_VERT='varying vec2 v_uv;void main(){v_uv=position.xy*0.5+0.5;gl_Position=vec4(position.xy,0.,1.);}';
const bhScene=new THREE.Scene(),bhCam=new THREE.Camera();

  u_bend:{value:1.5},u_steps:{value:110},u_alpha:{value:0},u_off:{value:new THREE.Vector2(0,0)},u_sky:{value:null},u_hasSky:{value:0}}});
{const q=new THREE.Mesh(new THREE.PlaneGeometry(2,2),bhMat);q.frustumCulled=false;bhScene.add(q);}

/* ---------- 真實AU距離 ---------- */
const AUD={mercury:0.39,venus:0.72,earth:1,mars:1.52,jupiter:5.2,saturn:9.5,uranus:19.19,neptune:30.07,pluto:39.5};
const AU_U=28;
let scaleMix=0,scaleMixT=0;
function effDist(d){const tr=(d.id&&AUD[d.id])?AUD[d.id]*AU_U:(d.dist||0);return (d.dist||0)*(1-scaleMix)+tr*scaleMix;}
function effSize(d){if(d.sun||!d.trueSize)return d.size;return d.size*(1-scaleMix)+d.trueSize*scaleMix;}
/* ---------- 位置更新 ---------- */
function bodyPos(b3,out){
 const d=b3.def;
 if(d.sun)return out.set(0,0,0);
 if(d.parent){const p=bodies3D[d.parent].mesh;
  p.getWorldPosition(out);
  out.x+=Math.cos(b3.angle)*d.orbitR;out.z+=Math.sin(b3.angle)*d.orbitR;return out;}
 const Rr=effDist(d);
 out.set(Math.cos(b3.angle)*Rr,0,Math.sin(b3.angle)*Rr);return out;}
const _v=new THREE.Vector3();
function updateBodies(dt){
 for(const id in bodies3D){const b3=bodies3D[id];if(id==='belt'){b3.mesh.rotation.y+=dt*0.004*timeScale;continue;}
  const d=b3.def;
  if(!d.sun&&d.period)b3.angle+=dt*(2*Math.PI/90)*(365/Math.abs(d.period))*(d.period<0?-1:1)*timeScale;
  bodyPos(b3,_v);b3.grp.position.copy(_v);
  b3.mesh.rotation.y+=dt*(d.spin||0.2)*timeScale;
  if(b3.tiltG&&!d.sun&&d.trueSize){const k=effSize(d)/d.size;if(Math.abs(b3.tiltG.scale.x-k)>1e-4)b3.tiltG.scale.setScalar(k);}
  if(b3.def.clouds)b3.def.clouds.rotation.y+=dt*0.06*timeScale;}
}

function updateLabels(){
 const W=canvas.clientWidth,H=canvas.clientHeight;
 const put=(id,x,y,txt,op)=>{const d=labelDivs[id];if(!d)return;
  if(op<=0.02||!showLabel){d.style.display='none';return;}
  d.style.display='block';d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=op;
  if(d.innerHTML!==txt)d.innerHTML=txt;};
 const proj=(v)=>{_v.copy(v).project(camera);
  return[( _v.x*0.5+0.5)*W,(-_v.y*0.5+0.5)*H,_v.z<1];};
 const wput=(id,wx,wy,wz,txt,op)=>{_v.set(wx,wy,wz);_v.applyMatrix4(galaxyGrp.matrixWorld);const pr=proj(_v);put(id,pr[0],pr[1]-16,txt,pr[2]?(op===undefined?0.95:op):0);};

  const sp2=galArmPt(Math.PI/2,2.2);wput('map_sag',sp2[0],sp2[1]+40,sp2[2],t('mapsag'),galOp*0.85*armOp);
  const sp3=galArmPt(Math.PI,3.9);wput('map_sct',sp3[0],sp3[1]+40,sp3[2],t('mapsct'),galOp*0.85*armOp);
  const sp4=galArmPt(Math.PI*1.5,2.2);wput('map_nor',sp4[0],sp4[1]+40,sp4[2],t('mapnor'),galOp*0.85*armOp);
  if(galAnim.lmc)wput('map_lmc',galAnim.lmc.position.x,galAnim.lmc.position.y+200,galAnim.lmc.position.z,t('maplmc'),galOp*0.8*armOp);
  if(galAnim.smc)wput('map_smc',galAnim.smc.position.x,galAnim.smc.position.y+120,galAnim.smc.position.z,t('mapsmc'),galOp*0.8*armOp);
  wput('map_scale',-1350,-40,1150,t('scale10k'),galOp*0.9*armOp);
 }else MAPL.forEach(id=>put(id,0,0,'',0));
 // 太陽系
 const far=camD>500;
 if(mode==='system'){

function size(){const r=canvas.parentElement.getBoundingClientRect();
 const w=Math.max(200,r.width),h=Math.max(200,r.height);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 // 視覺重心偏移：直屏往上（避開底部面板+資訊卡），橫屏略偏左（資訊卡喺右邊）

}

let last=performance.now(),fpsA=60,lastQ=0;
function frame(now){
 requestAnimationFrame(frame);
 let rdt=(now-last)/1000;last=now;if(rdt>1)rdt=1;   // 真實時間（相機/淡入淡出用）
 let dt=Math.min(rdt,0.05);                          // 物理時間（軌道用）
 fpsA=fpsA*0.95+(1/Math.max(dt,1e-3))*0.05;
 if(tourOn&&!document.hidden){tourT+=dt;
  if(tourT>11){tourT=0;tourIdx=(tourIdx+1)%TOUR.length;goFocus(TOUR[tourIdx],true);}}
 scaleMix+=(scaleMixT-scaleMix)*Math.min(1,dt*2);
 for(const id in ORBITS){const o=ORBITS[id];o.line.scale.setScalar(Math.max(0.001,effDist(o.def)/(o.def.dist||1)));}
 if(bodies3D.belt)bodies3D.belt.mesh.scale.setScalar(1+0.35*scaleMix);
 updateBodies(dt);
 // 相機（主場景）
 const k=1-Math.pow(0.002,rdt);
 camD+=(tgtD-camD)*k;
 focusTarget(camTarget);
 camPos.set(
  camTarget.x+camD*Math.sin(camP)*Math.cos(camT),
  camTarget.y+camD*Math.cos(camP),
  camTarget.z+camD*Math.sin(camP)*Math.sin(camT));
 camera.position.lerp(camPos,1-Math.pow(0.0001,rdt));
 camera.lookAt(camTarget);
 if(mode==='galaxy'&&drags.size===0)camT+=dt*0.025;   // 銀河慢慢自轉展示
 else if(tourOn)camT+=dt*0.02;
 // 黑洞相機 + 淡入淡出
 if(mode==='sgra'){idleT+=rdt;
  if(diving){bhDT=Math.max(2.08,bhDT-rdt*Math.max(0.6,bhDT*0.18));if(bhDT<=2.081){diving=false;idleT=-6;}}   // 跌落去：越近越快
  else if(idleT>4&&bhDT>4.5)bhDT-=rdt*0.12*(bhDT-4);                                                       // 冇動作時慢慢被引力拉近
 }
 bhD+=(bhDT-bhD)*(1-Math.pow(0.003,rdt));
 bhAlpha+=(bhAlphaT-bhAlpha)*Math.min(1,rdt*1.6);
 if(Math.abs(bhAlpha-bhAlphaT)<0.004)bhAlpha=bhAlphaT;
 if(bhAlpha>0.001){
  bhTime+=dt*Math.max(0.15,Math.min(timeScale,3));
  // 自適應品質：fps低就減步數
  if(mode==='sgra'&&now-lastQ>2000){lastQ=now;
   if(fpsA<26&&bhSteps>50){bhSteps-=10;bhMat.uniforms.u_steps.value=bhSteps;}
   else if(fpsA>55&&bhSteps<(isMobile?90:140)){bhSteps+=10;bhMat.uniforms.u_steps.value=bhSteps;}}
 }
 // 太陽系動畫
 if(mode==='system'){const glowI=1+0.06*Math.sin(now*0.004);glow.scale.set(55*glowI,55*glowI,1);}
 // 銀河動畫
 if(galaxyGrp.visible){
  galaxyGrp.rotation.y+=dt*0.004*Math.max(0.2,Math.min(timeScale,3));
  if(galAnim.sgra){const sp3=1+0.35*Math.sin(now*0.006);galAnim.sgra.scale.set(50*sp3,50*sp3,1);}
  for(const tw of galAnim.tw)tw.material.opacity=tw.userData.base*(0.7+0.5*Math.abs(Math.sin(now*0.001+tw.userData.tw)));
  if(galAnim.mark){const mp=1+0.22*Math.sin(now*0.005);galAnim.mark.scale.set(70*mp,70*mp,1);}
  for(const r of galAnim.rings){const ph=((now*0.00035)+r.userData.ph)%1;const sc=1+ph*2.6;r.scale.set(sc,sc,sc);r.material.opacity=0.75*(1-ph);}
 }
 // 渲染
 renderer.clear();
 if(bhAlpha<0.999)renderer.render(scene,camera);
 if(bhAlpha>0.001){
  const u=bhMat.uniforms;u.u_time.value=bhTime;u.u_dist.value=bhD;u.u_ang.value.set(camT,Math.max(0.2,Math.min(1.45,camP)));u.u_alpha.value=bhAlpha;
  renderer.render(bhScene,bhCam);}
 updateLabels();
 const cur=getTgt();
 if(Math.abs(cur-sliderToDist(+zoomSlider.value))>cur*0.05+0.01)zoomSlider.value=distToSlider(curD());
}
buildLabels();buildPlanetBtns();buildTable();
setMode('galaxy');layoutInfo();tgtD=fitGalaxy();camD=tgtD*3.5;
applyLang();
setTimeout(showMilky,900);
requestAnimationFrame(frame);
</script>
</body>
</html>
