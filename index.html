<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Galaxy Voyage · 銀河系漫遊</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{background:#020208;color:#e8f4ff;font-family:-apple-system,"PingFang HK","Microsoft JhengHei","Noto Sans TC",sans-serif;overflow-x:hidden}
  #hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #gl:active{cursor:grabbing}
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  .lbl{position:absolute;transform:translate(-50%,-130%);font-size:12px;font-weight:800;color:#fff;white-space:nowrap;
    text-shadow:0 1px 6px #000,0 0 10px rgba(0,229,255,.7);pointer-events:auto;cursor:pointer;padding:2px 6px}
  #loading{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#020208;transition:opacity .6s}
  #loading .spin{width:54px;height:54px;border-radius:50%;border:4px solid rgba(0,229,255,.2);border-top-color:#00e5ff;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #loadTxt{font-size:14px;color:#8be9fd}
  #title{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;text-align:center;pointer-events:none}
  #title h1{font-size:clamp(24px,5.5vw,40px);font-weight:900;letter-spacing:2px;text-shadow:0 0 24px #00e5ff,0 2px 8px #000}
  #title p{font-size:clamp(12px,3vw,14px);color:#a5f3fc;margin-top:4px;text-shadow:0 1px 6px #000}
  #info{position:absolute;z-index:7;left:10px;right:10px;bottom:calc(196px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
    background:rgba(5,10,25,.85);border:1px solid rgba(0,229,255,.4);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);
    max-height:34vh;overflow-y:auto}
  #info.hidden{display:none}
  #info h3{font-size:19px;margin-bottom:4px}
  #info .blurb{font-size:13.5px;line-height:1.8;color:#cfe8ff;margin-bottom:8px}
  #info table{width:100%;border-collapse:collapse;font-size:13px}
  #info td{padding:3px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
  #info td.k{color:#8be9fd;width:38%}
  #infoClose{float:right;background:none;border:none;color:#8be9fd;font-size:18px}
  #infoImg{width:100%;border-radius:12px;margin:6px 0 2px;border:1px solid rgba(0,229,255,.3)}
  #infoCap{font-size:11px;color:#7d93ad;margin-bottom:6px}
  #scaleBadge{position:absolute;z-index:6;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border:1px solid rgba(255,209,102,.6);color:#ffd166;border-radius:12px;padding:6px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  .lbl small{font-size:10px;color:#ffd166;font-weight:800}
  #panel{position:absolute;z-index:6;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;background:rgba(5,10,25,.72);border:1px solid rgba(0,229,255,.35);
    border-radius:16px;padding:10px 12px;backdrop-filter:blur(8px)}
  #panel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
  .pbtn{background:rgba(0,229,255,.12);border:1px solid rgba(0,229,255,.5);color:#dffaff;border-radius:10px;
    padding:7px 10px;font-size:12.5px;font-weight:800}
  .pbtn:active{transform:scale(.94);background:rgba(0,229,255,.3)}
  .pbtn.on{background:rgba(0,229,255,.32);border-color:#00e5ff}
  select.pbtn{appearance:none;-webkit-appearance:none}
  select.pbtn option{color:#000}
  #panel label{font-size:12px;color:#8be9fd;display:flex;align-items:center;gap:6px;margin-top:8px}
  #panel input[type=range]{flex:1;accent-color:#00e5ff}
  #panel .val{font-size:12px;color:#ffd166;min-width:52px;text-align:right}
  #hint{margin-top:6px;font-size:11px;color:#7d93ad;text-align:center}
  section{max-width:720px;margin:0 auto;padding:44px 18px 10px}
  section h2{font-size:24px;margin-bottom:4px;text-shadow:0 0 14px rgba(0,229,255,.6)}
  section .sub{color:#8be9fd;font-size:14px;margin-bottom:14px}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(0,229,255,.22);border-radius:14px;padding:14px 15px;margin-bottom:12px;line-height:1.9;font-size:15px}
  .card b{color:#ffd166}
  table.data{width:100%;border-collapse:collapse;font-size:13px;background:rgba(255,255,255,.03);border-radius:14px;overflow:hidden}
  table.data th,table.data td{padding:8px 8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left}
  table.data th{color:#8be9fd;font-size:12px}
  table.data tr:last-child td{border-bottom:none}
  footer{text-align:center;color:#5b6b82;font-size:12px;padding:30px 18px 50px;line-height:2}
</style>
</head>
<body>

<div id="hero">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="loading"><div class="spin"></div><div id="loadTxt">Loading textures…</div></div>
  <div id="title">
    <h1 data-i18n="title_h1">🌌 Galaxy Voyage</h1>
    <p data-i18n="title_p">Milky Way → Solar System → Earth &amp; Moon · drag to orbit / scroll to zoom</p>
  </div>
  <div id="scaleBadge" style="display:none"></div>
  <div id="info" class="hidden">
    <button id="infoClose">✕</button>
    <h3 id="infoName"></h3>
    <img id="infoImg" style="display:none" alt="map">
    <div id="infoCap" style="display:none"></div>
    <div class="blurb" id="infoBlurb"></div>
    <table id="infoStats"></table>
  </div>
  <div id="panel">
    <div class="row" id="navRow">
      <button class="pbtn" id="bhBtn">🕳️</button>
      <button class="pbtn" data-go="mmap">🗺️</button>
      <button class="pbtn" data-go="system">☀️</button>
    </div>
    <div class="row" id="planetRow" style="margin-top:6px"></div>
    <label><span data-i18n="zoom_l">Zoom</span><input type="range" id="zoom" min="0" max="1000" value="1000"><span class="val" id="zoomRead"></span></label>
    <label><span data-i18n="time_l">Time</span><input type="range" id="time" min="0" max="100" value="35"><span class="val" id="timeRead">1.0×</span></label>
    <div class="row" style="margin-top:8px">
      <select id="langSel" class="pbtn">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ms">Melayu</option>
        <option value="ko">한국어</option>
        <option value="ja">日本語</option>
      </select>
      <button class="pbtn on" id="orbitBtn">🛰️</button>
      <button class="pbtn on" id="labelBtn">🏷️</button>
      <button class="pbtn on" id="tourBtn">🧭</button>
      <button class="pbtn" id="distBtn" data-i18n="tb_dist">📏</button>
    </div>
    <div id="hint" data-i18n="hint">👆 Drag to orbit · scroll / pinch to zoom · tap a planet for details</div>
  </div>
</div>

<section>
  <h2 data-i18n="s1h">Planets at a glance</h2>
  <div class="sub" data-i18n="s1sub">Sizes and distances in 3D are compressed so everything fits on screen — real numbers below</div>
  <div class="card" style="overflow-x:auto"><table class="data" id="dataTable"></table></div>
  <div class="card" data-i18n="note"></div>
</section>

<footer data-i18n="foot"></footer>

<script src="three.min.js"></script>

/* ---------- 程序紋理 ---------- */
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function R(a){let s=a;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function tex(c){const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
function bandTex(base,bands,seed,wobble){
 const w=512,h=256,c=cnv(w,h),g=c.getContext('2d'),rnd=R(seed);
 g.fillStyle=base;g.fillRect(0,0,w,h);
 for(const [y0,y1,col] of bands){
  g.fillStyle=col;
  g.beginPath();g.moveTo(0,y0);
  for(let x=0;x<=w;x+=8)g.lineTo(x,y0+Math.sin(x*0.02+y0)*wobble+(rnd()-0.5)*4);
  for(let x=w;x>=0;x-=8)g.lineTo(x,y1+Math.sin(x*0.025+y1)*wobble+(rnd()-0.5)*4);
  g.fill();}
 for(let i=0;i<900;i++){g.fillStyle=`rgba(255,255,255,${rnd()*0.05})`;g.fillRect(rnd()*w,rnd()*h,2,1);}
 return tex(c);}
function rockTex(base,dark,nC,seed){
 const w=512,h=256,c=cnv(w,h),g=c.getContext('2d'),rnd=R(seed);
 g.fillStyle=base;g.fillRect(0,0,w,h);
 for(let i=0;i<nC;i++){const x=rnd()*w,y=rnd()*h,r=2+rnd()*14;
  g.fillStyle=dark;g.globalAlpha=0.5;g.beginPath();g.arc(x,y,r,0,7);g.fill();
  g.globalAlpha=0.35;g.fillStyle='#fff';g.beginPath();g.arc(x-r*0.25,y-r*0.25,r*0.55,0,7);g.fill();g.globalAlpha=1;}
 for(let i=0;i<1500;i++){g.fillStyle=`rgba(0,0,0,${rnd()*0.08})`;g.fillRect(rnd()*w,rnd()*h,2,2);}
 return tex(c);}
function earthTex(){
 const w=1024,h=512,c=cnv(w,h),g=c.getContext('2d'),rnd=R(42);
 g.fillStyle='#0b3d91';g.fillRect(0,0,w,h);
 const blobs=28;
 for(let i=0;i<blobs;i++){const x=rnd()*w,y=h*0.15+rnd()*h*0.7,r=30+rnd()*110;
  const gr=g.createRadialGradient(x,y,5,x,y,r);
  const land=rnd()<0.6;
  gr.addColorStop(0,land?'#3d7a2d':'#8a6f3c');gr.addColorStop(1,'rgba(11,61,145,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
 g.fillStyle='#7a5c30';
 for(let i=0;i<12;i++){const x=rnd()*w,y=h*0.35+rnd()*h*0.3;
  g.globalAlpha=0.5;g.beginPath();g.ellipse(x,y,20+rnd()*60,12+rnd()*25,0,0,7);g.fill();g.globalAlpha=1;}
 const ice=g.createLinearGradient(0,0,0,h);
 ice.addColorStop(0,'rgba(255,255,255,.95)');ice.addColorStop(0.12,'rgba(255,255,255,0)');
 ice.addColorStop(0.88,'rgba(255,255,255,0)');ice.addColorStop(1,'rgba(255,255,255,.95)');
 g.fillStyle=ice;g.fillRect(0,0,w,h);
 return tex(c);}
function cloudTex(){
 const w=512,h=256,c=cnv(w,h),g=c.getContext('2d'),rnd=R(7);
 g.clearRect(0,0,w,h);
 for(let i=0;i<130;i++){const x=rnd()*w,y=rnd()*h,r=8+rnd()*30;
  const gr=g.createRadialGradient(x,y,1,x,y,r);
  gr.addColorStop(0,'rgba(255,255,255,.75)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
 return tex(c);}
function sunTex(){
 const w=512,h=256,c=cnv(w,h),g=c.getContext('2d'),rnd=R(99);
 const gr=g.createLinearGradient(0,0,0,h);
 gr.addColorStop(0,'#ffdd66');gr.addColorStop(0.5,'#ff9933');gr.addColorStop(1,'#ff6611');
 g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<2600;i++){const x=rnd()*w,y=rnd()*h,r=1+rnd()*5;
  g.fillStyle=rnd()<0.5?`rgba(255,240,180,${0.15+rnd()*0.3})`:`rgba(200,60,0,${0.15+rnd()*0.3})`;
  g.beginPath();g.arc(x,y,r,0,7);g.fill();}
 return tex(c);}
function glowTex(){
 const c=cnv(128,128),g=c.getContext('2d');
 const gr=g.createRadialGradient(64,64,2,64,64,64);
 gr.addColorStop(0,'rgba(255,240,200,1)');gr.addColorStop(0.25,'rgba(255,200,120,.55)');gr.addColorStop(1,'rgba(255,150,50,0)');
 g.fillStyle=gr;g.fillRect(0,0,128,128);
 return tex(c);}
function dotTex(){
 const c=cnv(32,32),g=c.getContext('2d');
 const gr=g.createRadialGradient(16,16,1,16,16,16);
 gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=gr;g.fillRect(0,0,32,32);
 return tex(c);}
function ringTex(){
 const c=cnv(256,8),g=c.getContext('2d'),rnd=R(5);
 for(let x=0;x<256;x++){
  const u=x/256;
  let a=0.25+0.6*Math.abs(Math.sin(u*40+rnd()*0))* (0.5+0.5*Math.sin(u*13));
  if(u>0.62&&u<0.70)a=0.03; // 卡西尼環縫
  if(u<0.06)a*=u/0.06;
  const shade=180+Math.floor(60*Math.sin(u*90));
  g.fillStyle=`rgba(${shade},${shade-20},${shade-60},${Math.max(0,Math.min(1,a))})`;
  g.fillRect(x,0,1,8);}
 return tex(c);}
function galaxyTex(){
 const c=cnv(512,512),g=c.getContext('2d'),rnd=R(2024);
 g.clearRect(0,0,512,512);
 const gr=g.createRadialGradient(256,256,4,256,256,60);
 gr.addColorStop(0,'rgba(255,250,230,.95)');gr.addColorStop(1,'rgba(255,250,230,0)');
 g.fillStyle=gr;g.beginPath();g.arc(256,256,60,0,7);g.fill();
 for(let a=0;a<2;a++)for(let i=0;i<900;i++){
  const th=rnd()*Math.PI*4+a*Math.PI,r=40+rnd()*200;
  const rr=40+Math.pow(rnd(),0.6)*200;
  const x=256+Math.cos(th+rr*0.012)*rr,y=256+Math.sin(th+rr*0.012)*rr*0.62;
  const s=rnd();
  g.fillStyle=s<0.75?`rgba(160,190,255,${0.25+rnd()*0.5})`:(s<0.9?`rgba(255,220,180,${0.3+rnd()*0.5})`:`rgba(255,150,200,${0.3+rnd()*0.4})`);
  const sz=rnd()<0.92?1:2;g.fillRect(x,y,sz,sz);}
 return tex(c);}

const loadMan=new THREE.LoadingManager();

function srgbTx(x){x.encoding=THREE.sRGBEncoding;x.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return x;}
function realTex(f,ok){texLoader.load('tex/'+f,tx=>{ok(srgbTx(tx));},undefined,()=>{});}
const REALTEX={sun:'sun.jpg',mercury:'mercury.jpg',venus:'venus.jpg',earth:'earth_day.jpg',moon:'moon.jpg',mars:'mars.jpg',jupiter:'jupiter.jpg',saturn:'saturn.jpg',uranus:'uranus.jpg',neptune:'neptune.jpg',io:'io.jpg',europa:'europa.jpg',ganymede:'ganymede.jpg',callisto:'callisto.jpg'};
function loadReal(b,mat){
 const f=REALTEX[b.id];if(!f)return;
 realTex(f,tx=>{mat.map=tx;mat.needsUpdate=true;
  if(b.id==='moon'||b.id==='mars'||b.id==='mercury'||b.id==='callisto'){mat.bumpMap=tx;mat.bumpScale=0.5;mat.needsUpdate=true;}
  if(b.id==='earth'){
   realTex('earth_night.jpg',nt=>{const b3=bodies3D.earth;if(!b3)return;
    const tg=b3.grp.children.find(o=>o.type==='Group')||b3.grp;
    tg.add(new THREE.Mesh(new THREE.SphereGeometry(b.size*1.004,48,32),
     new THREE.MeshBasicMaterial({map:nt,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false})));});
   realTex('earth_clouds.jpg',ct=>{const b3=bodies3D.earth;
    if(b3&&b3.def.clouds){b3.def.clouds.material=new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,depthWrite:false,alphaMap:ct});b3.def.clouds.material.needsUpdate=true;}});
   realTex('earth_normal.jpg',nm2=>{mat.normalMap=nm2;mat.normalScale=new THREE.Vector2(0.85,0.85);mat.needsUpdate=true;});
   realTex('earth_specular.jpg',sp=>{mat.specularMap=sp;mat.specular=new THREE.Color(0x777777);mat.needsUpdate=true;});
  }
 });
}

function buildBody(b){
 const grp=new THREE.Group();
 const mat=b.sun?new THREE.MeshBasicMaterial({map:TEXMAP[b.id]()}):
  new THREE.MeshPhongMaterial({map:TEXMAP[b.id](),shininess:6,specular:0x222222});
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(b.size,48,32),mat);
 const tiltG=new THREE.Group();tiltG.add(mesh);tiltG.rotation.z=(b.tilt||0)*Math.PI/180;grp.add(tiltG);
 if(b.id==='earth'){
  const cl=new THREE.Mesh(new THREE.SphereGeometry(b.size*1.02,48,32),
   new THREE.MeshPhongMaterial({map:cloudTex(),transparent:true,depthWrite:false}));
  tiltG.add(cl);b.clouds=cl;}
 if(b.ring){
  const rg=new THREE.RingGeometry(b.ring[0],b.ring[1],128,1);
  const pp=rg.attributes.position,uu=rg.attributes.uv;
  for(let i=0;i<pp.count;i++){const rr=Math.hypot(pp.getX(i),pp.getY(i));
   uu.setXY(i,(rr-b.ring[0])/(b.ring[1]-b.ring[0]),0.5);}
  const rm=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({map:ringTex(),transparent:true,side:THREE.DoubleSide,depthWrite:false}));
  rm.rotation.x=-Math.PI/2;grp.add(rm);}
 scene.add(grp);
 loadReal(b,mat);
 bodies3D[b.id]={def:b,grp,mesh,angle:Math.random()*Math.PI*2};
 return bodies3D[b.id];}

/* ---------- 真實AU距離 ---------- */
const AUD={mercury:0.39,venus:0.72,earth:1,mars:1.52,jupiter:5.2,saturn:9.5,uranus:19.19,neptune:30.07};
const AU_U=28;
let scaleMix=0,scaleMixT=0;
function effDist(d){const tr=(d.id&&AUD[d.id])?AUD[d.id]*AU_U:(d.dist||0);return (d.dist||0)*(1-scaleMix)+tr*scaleMix;}
/* ---------- 位置更新 ---------- */
const YEAR_K=365/90; // 地球1年=90秒(1×時)
function bodyPos(b3,out){
 const d=b3.def;
 if(d.sun)return out.set(0,0,0);
 if(d.parent){const p=bodies3D[d.parent].mesh; // 月球繞行星
  p.getWorldPosition(out);
  out.x+=Math.cos(b3.angle)*d.orbitR;out.z+=Math.sin(b3.angle)*d.orbitR;return out;}
 const R=effDist(d);
 out.set(Math.cos(b3.angle)*R,0,Math.sin(b3.angle)*R);return out;}
const _v=new THREE.Vector3();
function updateBodies(dt){
 for(const id in bodies3D){const b3=bodies3D[id];if(id==='belt'){b3.mesh.rotation.y+=dt*0.004*timeScale;continue;}
  const d=b3.def;
  if(!d.sun&&d.period)b3.angle+=dt*(2*Math.PI/90)*(365/Math.abs(d.period))*(d.period<0?-1:1)*timeScale;
  bodyPos(b3,_v);b3.grp.position.copy(_v);
  b3.mesh.rotation.y+=dt*(d.spin||0.2)*timeScale;
  if(b3.def.clouds)b3.def.clouds.rotation.y+=dt*0.06*timeScale;}
 // 土星環永遠向住大致方向(跟組) — 已在組內,自動跟隨
}

$('orbitBtn').onclick=function(){showOrbit=!showOrbit;this.classList.toggle('on',showOrbit);
 scene.traverse(o=>{if(o.name==='orbit'||o.name==='belt')o.visible=showOrbit;});};
$('labelBtn').onclick=function(){showLabel=!showLabel;this.classList.toggle('on',showLabel);};
$('distBtn').onclick=function(){scaleMixT=scaleMixT>0.5?0:1;this.classList.toggle('on',scaleMixT>0.5);
 const bd=$('scaleBadge');
 if(scaleMixT>0.5){bd.innerHTML=t('scalemode');bd.style.display='block';if(focusId==='system')tgtD=1000;}
 else bd.style.display='none';};
document.querySelectorAll('#navRow [data-go]').forEach(b=>b.onclick=()=>{audio();hideInfo();goFocus(b.dataset.go);});
$('bhBtn').onclick=()=>window.open('https://zero5phh-ops.github.io/blackhole-voyage/','_blank');
function buildPlanetBtns(){const row=$('planetRow');row.innerHTML='';
 for(const b of BODIES){if(b.sun||b.parent)continue;
  const btn=document.createElement('button');btn.className='pbtn';btn.textContent=bn(b);
  btn.onclick=()=>{audio();goFocus(b.id);};row.appendChild(btn);}}
function audio(){return null;}

/* ---------- 標籤 ---------- */
const labelLayer=$('labels'),labelDivs={};
function buildLabels(){
 const ids=['galaxy','system'].concat(BODIES.map(b=>b.id));
 for(const id of ids){const d=document.createElement('div');d.className='lbl';d.style.display='none';
  d.onclick=()=>goFocus(id);labelLayer.appendChild(d);labelDivs[id]=d;}
 const maps=[['map_cap',null],['map_center',null],['map_sun','system'],['map_per',null],['map_sag',null],['map_sgra',null],['map_scale',null]];
 for(const [id,go] of maps){const d=document.createElement('div');d.className='lbl';d.style.display='none';
  d.onclick=()=>{if(go)goFocus(go);else showMilky();};labelLayer.appendChild(d);labelDivs[id]=d;}
 labelDivs.map_sgra.onclick=()=>window.open('https://zero5phh-ops.github.io/blackhole-voyage/','_blank');}
function updateLabels(){
 const W=canvas.clientWidth,H=canvas.clientHeight;
 const put=(id,x,y,txt,op)=>{const d=labelDivs[id];if(!d)return;
  if(op<=0.02||!showLabel){d.style.display='none';return;}
  d.style.display='block';d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=op;
  if(d.innerHTML!==txt)d.innerHTML=txt;};
 const proj=(v)=>{_v.copy(v).project(camera);
  return[( _v.x*0.5+0.5)*W,(-_v.y*0.5+0.5)*H,_v.z<1];};
 const far=camD>500;
 let v=new THREE.Vector3();
 // 太陽系標記
 v.set(0,0,0);let [sx2,sy2,ok2]=proj(v);
 put('system',sx2,sy2-30,t('sys'),(ok2&&camD>420&&focusId!=='mmap')?0.95:0);
 if(focusId==='mmap'){
  put('map_cap',W/2,84,t('mapcap2'),0.95);
  const wput=(id,wx,wy,wz,txt)=>{_v.set(wx,wy,wz);const pr=proj(_v);put(id,pr[0],pr[1]-16,txt,pr[2]?0.95:0);};
  wput('map_center',GALC.x,GALC.y+130,GALC.z,t('mapcenter'));
  const ssp=galSun();wput('map_sun',ssp[0],ssp[1]+95,ssp[2],t('mapsun'));
  const pp=galArmPt(ARM_P1,4.15);wput('map_per',pp[0],pp[1]+70,pp[2],t('mapper'));
  const sp2=galArmPt(ARM_P2,3.3);wput('map_sag',sp2[0],sp2[1]+70,sp2[2],t('mapsag'));
  wput('map_sgra',GALC.x,GALC.y+45,GALC.z,t('sgra'));
  wput('map_scale',GALC.x-1350,GALC.y-10,GALC.z+1100,t('scale10k'));
 }else{['map_cap','map_center','map_sun','map_per','map_sag','map_sgra','map_scale'].forEach(id=>put(id,0,0,'',0));}
 for(const b of BODIES){
  if(focusId==='mmap'){put(b.id,0,0,'',0);continue;}
  const b3=bodies3D[b.id];v.copy(b3.grp.position);
  if(b.parent)v.y+=b.size+1.5;else v.y+=b.size+2;
  let [x,y,ok3]=proj(v);if(!ok3){put(b.id,0,0,'',0);continue;}
  let op=0;
  if(far){op=(b.sun)?0.9:0;}
  else if(b.parent){op=camD<90?0.9:0;}
  else{op=camD<500?0.9:0;}
  put(b.id,x,y,(scaleMix>0.5&&!b.parent&&b.stats.dis)?bn(b)+'<br><small>'+b.stats.dis+'</small>':bn(b),op);}
 $('zoomRead').textContent=Math.round(camD)+'u';}

/* ---------- 銀河系(我哋住喺入面) ---------- */
const MILKY={
 name:{zh:'🌌 銀河系',en:'🌌 Milky Way',ms:'🌌 Bima Sakti',ko:'🌌 은하수',ja:'🌌 天の川'},
 stats:{
  zh:[['直徑','約10萬光年'],['太陽位置','離中心約25,000光年 · 獵戶座-天鵝座旋臂'],['恆星數量','1000–4000億粒'],['銀河年','太陽繞一圈要2.3億年']],
  en:[['Diameter','~100,000 light-years'],['Where is the Sun','~25,000 ly from center · Orion–Cygnus Arm'],['Stars','100–400 billion'],['Galactic year','Sun orbits once every 230M years']],
  ms:[['Diameter','~100,000 tahun cahaya'],['Kedudukan Matahari','~25,000 tc dari pusat · Lengan Orion–Cygnus'],['Bintang','100–400 bilion'],['Tahun galaksi','Matahari mengelilingi sekali setiap 230J tahun']],
  ko:[['지름','약 10만 광년'],['태양 위치','중심에서 약 25,000광년 · 오리온-백조자리 나선팔'],['항성 수','1,000–4,000억 개'],['은하년','태양 공전 1회에 2.3억 년']],
  ja:[['直径','約10万光年'],['太陽の位置','中心から約25,000光年 · オリオン-白鳥座腕'],['恒星数','1,000–4,000億個'],['銀河年','太陽の公転1周は2.3億年']]},
 blurb:{
  zh:'重點糾正：太陽系唔喺銀河系出面 —— 我哋住喺入面！銀河係個棒旋星系。你而家見到橫跨天空嘅光帶，就係由入面向外望嘅銀河盤面。拉近，就會飛返去我哋屋企——太陽系。歐空局蓋亞任務正用十幾億粒星嘅數據繪製緊成個銀河地圖。',
  en:'Correction: the Solar System is not outside the Milky Way — we live inside it! Ours is a barred spiral. The glowing band across the sky is the galactic disk seen from within. Zoom in to fly home to the Solar System. ESA’s Gaia mission is mapping the whole Galaxy from billions of stars.',
  ms:'Pembetulan: Sistem Suria bukan di luar Bima Sakti — kita tinggal di dalamnya! Galaksi kita ialah pilin berpalang. Jalur cahaya merentasi langit ialah cakera galaksi dilihat dari dalam. Zum masuk untuk pulang ke Sistem Suria. Misi Gaia ESA sedang memetakan seluruh galaksi daripada bilion bintang.',
  ko:'정정: 태양계는 은하수 밖에 있지 않아요 — 우리는 안에 살고 있어요! 우리 은하는 막대나선은하예요. 하늘을 가로지르는 빛의 띠가 안에서 본 은하 원반이죠. 확대하면 집(태양계)으로 돌아가요. ESA 가이아 탐사선이 수십억 개 별 데이터로 은하 전체를 그리고 있어요.',
  ja:'訂正：太陽系は天の川の外ではありません —— 私たちは中に住んでいます！私たちの銀河は棒渦巻銀河。空を横切る光の帯が内側から見た銀河円盤です。ズームインで我が家（太陽系）へ帰りましょう。ESAガイアミッションが数十億の星データで銀河全体を描いています。'}};
function showMilky(){
 lastInfo='@milky';
 $('infoImg').src='tex/milkyway_map.jpg';
 $('infoImg').style.display='block';
 $('infoCap').innerHTML=t('mapcap');
 $('infoCap').style.display='block';
 $('infoName').textContent=MILKY.name[LANG]||MILKY.name.en;
 $('infoBlurb').textContent=MILKY.blurb[LANG]||MILKY.blurb.en;
 let h='';for(const [k,v] of (MILKY.stats[LANG]||MILKY.stats.en))h+=`<tr><td class="k">${k}</td><td>${v}</td></tr>`;
 $('infoStats').innerHTML=h;
 $('info').classList.remove('hidden');}

/* ---------- 資訊面板 ---------- */
const STATL={dia:'k_dia',dis:'k_dis',year:'k_year',day:'k_day',moon:'k_moon',temp:'k_temp',extra:'k_extra'};
function showInfo(id){
 const b=BODIES.find(x=>x.id===id);if(!b)return;
 $('infoImg').style.display='none';$('infoCap').style.display='none';
 $('infoName').textContent=bn(b);
 $('infoBlurb').textContent=b.blurb[LANG]||b.blurb.en;
 let h='';
 for(const k of['dia','dis','year','day','moon','temp','extra']){
  if(!b.stats[k])continue;
  const v=typeof b.stats[k]==='object'?(b.stats[k][LANG]||b.stats[k].en):b.stats[k];
  h+=`<tr><td class="k">${t(STATL[k])}</td><td>${v}</td></tr>`;}
 $('infoStats').innerHTML=h;
 $('info').classList.remove('hidden');}
function hideInfo(){$('info').classList.add('hidden');}
$('infoClose').onclick=hideInfo;

/* ---------- 資料表 ---------- */
function buildTable(){
 let h=`<tr><th>${t('th_name')}</th><th>${t('th_dia')}</th><th>${t('th_dis')}</th><th>${t('th_year')}</th><th>${t('th_moon')}</th></tr>`;
 for(const b of BODIES){if(b.parent||b.sun)continue;
  h+=`<tr><td>${bn(b)}</td><td>${b.stats.dia}</td><td>${b.stats.dis||'—'}</td><td>${b.stats.year}</td><td>${b.stats.moon}</td></tr>`;}
 $('dataTable').innerHTML=h;}

/* ---------- i18n apply ---------- */
function applyLang(){
 document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n);});
 buildPlanetBtns();buildTable();
 if(!$('info').classList.contains('hidden')&&lastInfo){if(lastInfo==='@milky')showMilky();else showInfo(lastInfo);}
 $('langSel').value=LANG;
 drawNow=true;}
let lastInfo=null;
const _showInfo=showInfo;
showInfo=function(id){lastInfo=id;_showInfo(id);};
$('langSel').value=LANG;
$('langSel').addEventListener('change',function(){LANG=this.value;localStorage.setItem('gv_lang',LANG);applyLang();});

/* ---------- 主循環 ---------- */
function size(){const r=canvas.parentElement.getBoundingClientRect();
 const w=Math.max(200,r.width),h=Math.max(200,r.height);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',size);size();
const camTarget=new THREE.Vector3(),camPos=new THREE.Vector3();
let last=performance.now(),drawNow=false;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;
 if(tourOn&&!document.hidden){tourT+=dt;
  if(tourT>9){tourT=0;tourIdx=(tourIdx+1)%TOUR.length;
   const id=TOUR[tourIdx];focusId=id;
   if(id==='mmap')enterMap();else tgtD=focusDist();
   if(id==='mmap'||id==='galaxy')showMilky();else if(id!=='system')showInfo(id);else hideInfo();}}
 scaleMix+=(scaleMixT-scaleMix)*Math.min(1,dt*2);
 for(const id in ORBITS){const o=ORBITS[id];o.line.scale.setScalar(Math.max(0.001,effDist(o.def)/(o.def.dist||1)));}
 if(bodies3D.belt)bodies3D.belt.mesh.scale.setScalar(1+0.35*scaleMix);
 updateBodies(dt);
 const k=1-Math.pow(0.002,dt);
 camD+=(tgtD-camD)*k;
 focusTarget(camTarget);
 camPos.set(
  camTarget.x+camD*Math.sin(camP)*Math.cos(camT),
  camTarget.y+camD*Math.cos(camP),
  camTarget.z+camD*Math.sin(camP)*Math.sin(camT));
 camera.position.lerp(camPos,1-Math.pow(0.0001,dt));
 camera.lookAt(camTarget);
 if(autoRot&&tourOn)camT+=dt*0.02;
 const glowI=1+0.06*Math.sin(now*0.004);
 glow.scale.set(55*glowI,55*glowI,1);
 for(const s of galAnim.spin)s.o.rotation.y+=dt*s.s;
 if(galAnim.sgra){const sp3=1+0.3*Math.sin(now*0.006);galAnim.sgra.scale.set(60*sp3,60*sp3,1);}
 for(const tw of galAnim.tw||[])tw.material.opacity=0.3+0.35*Math.abs(Math.sin(now*0.001+tw.userData.tw));
 if(galAnim.mark){const mp=1+0.22*Math.sin(now*0.005);galAnim.mark.scale.set(90*mp,90*mp,1);}
 for(const r of galAnim.rings){const ph=((now*0.00035)+r.userData.ph)%1;const sc=1+ph*2.6;r.scale.set(sc,sc,sc);r.material.opacity=0.75*(1-ph);}
 renderer.render(scene,camera);
 updateLabels();
 if(Math.abs(tgtD-sliderToDist(+zoomSlider.value))>tgtD*0.05+1)zoomSlider.value=distToSlider(camD);
}
buildLabels();buildPlanetBtns();buildTable();applyLang();
requestAnimationFrame(frame);
</script>
